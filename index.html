<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>森林学校 · 课间十分钟</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B0</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#6fb85c;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  body{display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  #wrap{position:relative;line-height:0;}
  #game{display:block;touch-action:none;background:#bfe8f7;border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.28);}
  #tip{position:absolute;left:50%;top:8px;transform:translateX(-50%);
    background:rgba(28,44,36,.86);color:#fff;font-size:12px;line-height:1.5;
    padding:8px 14px;border-radius:999px;white-space:nowrap;
    display:none;align-items:center;gap:10px;z-index:5;}
  #tip button{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:12px;
    padding:5px 12px;border-radius:999px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="tip"><span>横屏玩更舒服，也可以继续竖屏</span><button id="tipClose">知道了</button></div>
</div>
<script>
(function(){
'use strict';

/* ============================================================
 * 1. 基础常量与画布
 * ========================================================== */
var W = 960, H = 540;
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var tipEl = document.getElementById('tip');
var tipClose = document.getElementById('tipClose');

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var availW = window.innerWidth, availH = window.innerHeight;
  var s = Math.min(availW / W, availH / H);
  s = Math.max(0.08, Math.min(s, 1.6));
  var cssW = Math.round(W * s), cssH = Math.round(H * s);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
  /* 竖屏提示：非遮挡式，4 秒自动隐藏 */
  if(availH > availW * 1.15 && availW < 760){
    tipEl.style.display = 'flex';
    clearTimeout(resize._t);
    resize._t = setTimeout(function(){ tipEl.style.display = 'none'; }, 4000);
  }else{
    tipEl.style.display = 'none';
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });
if(tipClose) tipClose.addEventListener('click', function(){ tipEl.style.display = 'none'; });

/* ============================================================
 * 2. 绘图工具
 * ========================================================== */
function roundRect(x, y, w, h, r){
  if(w < 2 * r) r = w / 2;
  if(h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function rnd(a, b){ return a + Math.random() * (b - a); }
function rndInt(a, b){ return Math.floor(rnd(a, b + 1)); }
function hitRect(x, y, r){ return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

/* 森林主题背景（天空 + 远山 + 草地） */
function drawBackdrop(t, night){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, night > 0.3 ? '#5d7fa8' : '#bfe8f7');
  g.addColorStop(0.62, night > 0.3 ? '#8aa3c0' : '#e8f6ec');
  g.addColorStop(1, night > 0.3 ? '#9db08a' : '#d9f0c8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 远山 */
  ctx.fillStyle = night > 0.3 ? 'rgba(70,92,120,.55)' : 'rgba(150,200,170,.55)';
  ctx.beginPath();
  ctx.moveTo(0, 330);
  for(var i = 0; i <= 8; i++){
    ctx.lineTo(i * 120, 330 - Math.sin(i * 1.1) * 44 - 20);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  /* 远处树影 */
  ctx.fillStyle = night > 0.3 ? 'rgba(52,78,64,.45)' : 'rgba(120,180,130,.42)';
  for(var k = 0; k < 7; k++){
    var tx = ((k * 167 + t * 6) % (W + 160)) - 80;
    ctx.beginPath();
    ctx.ellipse(tx, 352, 52, 40, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(tx - 6, 352, 12, 46);
  }

  /* 云 */
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for(var c = 0; c < 4; c++){
    var cx = ((c * 280 + t * 10) % (W + 240)) - 120;
    var cy = 60 + (c % 3) * 46;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 42, 20, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 34, cy + 5, 30, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 32, cy + 6, 26, 14, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 草地 */
  ctx.fillStyle = night > 0.3 ? '#3f6b3a' : '#7fc96a';
  ctx.fillRect(0, 400, W, H - 400);
  ctx.fillStyle = night > 0.3 ? '#4a7a44' : '#8fd06a';
  ctx.beginPath();
  ctx.moveTo(0, 408);
  for(var q = 0; q <= 16; q++){
    ctx.lineTo(q * 60, 400 + Math.sin(q * 0.9) * 7);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  if(night > 0.02){
    ctx.fillStyle = 'rgba(30,50,110,' + (night * 0.34) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* 通用按钮 */
function drawButton(r, label, fill, textColor, disabled){
  ctx.globalAlpha = disabled ? 0.45 : 1;
  ctx.fillStyle = fill;
  roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
  roundRect(r.x, r.y, r.w, r.h, 14); ctx.stroke();
  ctx.fillStyle = textColor;
  ctx.font = '500 22px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'central';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.globalAlpha = 1;
}

/* ============================================================
 * 3. 音频：Web Audio 实时合成（音效 + 循环 BGM）
 * ========================================================== */
var Audio2 = {
  enabled:true, ctx:null,
  musicOn:true, musicCtx:null, musicGain:null, hatBuf:null,
  /* C 大调五声音阶 32 步 A/B 句，与跑酷版同一首 */
  MUSIC_MEL:[
    392.00, 440.00, 523.25, 587.33, 659.25, 587.33, 523.25, 440.00,
    392.00, 440.00, 523.25, 659.25, 587.33, 523.25, 440.00, 392.00,
    523.25, 659.25, 783.99, 659.25, 587.33, 659.25, 523.25, 440.00,
    523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33
  ],
  MUSIC_BASS:[
    65.41, 65.41, 55.00, 55.00, 43.65, 43.65, 49.00, 49.00,
    65.41, 65.41, 43.65, 43.65, 49.00, 49.00, 49.00, 49.00
  ],

  init:function(){
    if(this.ctx || !this.enabled) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){ this.enabled = false; return; }
      this.ctx = new AC();
    }catch(e){ this.enabled = false; }
  },

  /* 基础音 */
  tone:function(freq, dur, type, vol, delay){
    if(!this.enabled) return;
    this.init();
    if(!this.ctx) return;
    var t0 = this.ctx.currentTime + (delay || 0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.16), t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.04);
  },

  click:function(){ this.tone(660, 0.09, 'triangle', 0.13); },
  good:function(n){
    var f = [523, 659, 784, 1047];
    var i = Math.min(3, (n || 1) - 1);
    this.tone(f[i], 0.16, 'triangle', 0.17);
    this.tone(f[i] * 1.5, 0.12, 'sine', 0.07, 0.05);
  },
  bad:function(){ this.tone(180, 0.26, 'sawtooth', 0.13); this.tone(120, 0.3, 'sine', 0.1, 0.03); },
  flip:function(){ this.tone(520, 0.07, 'square', 0.07); },
  match:function(){ this.tone(659, 0.14, 'triangle', 0.15); this.tone(988, 0.2, 'sine', 0.1, 0.07); },
  win:function(){
    var self = this;
    [523, 659, 784, 1046].forEach(function(f, i){ self.tone(f, 0.2, 'triangle', 0.15, i * 0.1); });
  },
  over:function(){
    var self = this;
    [440, 370, 294, 220].forEach(function(f, i){ self.tone(f, 0.24, 'sawtooth', 0.11, i * 0.12); });
  },

  /* ---- 循环 BGM ---- */
  startMusic:function(){
    if(!this.enabled || !this.musicOn || this.musicCtx) return;
    this.init();
    if(!this.ctx) return;
    if(!this.musicGain){
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.0001;
      this.musicGain.connect(this.ctx.destination);
    }
    var now = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(now);
    this.musicGain.gain.setValueAtTime(Math.max(0.0002, this.musicGain.gain.value), now);
    this.musicGain.gain.exponentialRampToValueAtTime(0.85, now + 0.7);
    this.musicCtx = { startTime:now + 0.15, beat:0.42, next:0 };
    this._schedMusic();
  },
  _schedMusic:function(){
    if(!this.musicCtx || !this.ctx) return;
    var self = this, m = this.musicCtx, now = this.ctx.currentTime;
    var lookahead = 1.0;
    while(m.startTime + m.next * m.beat < now + lookahead){
      var i = m.next;
      var t = m.startTime + i * m.beat;
      var f = this.MUSIC_MEL[i % 32];
      this._musicNote(f, t, m.beat * 0.92, 0.048, 'triangle');
      if(i % 2 === 0){
        this._musicNote(this.MUSIC_BASS[(i / 2) % 16], t, m.beat * 1.7, 0.078, 'sine');
      }
      this._musicHat(t, i % 2 === 0 ? 0.028 : 0.013);
      m.next++;
    }
    m.timer = setTimeout(function(){ self._schedMusic(); }, 200);
  },
  _musicNote:function(freq, t, dur, vol, type){
    if(!this.ctx) return;
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.musicGain || this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  _musicHat:function(t, vol){
    if(!this.ctx || !(vol > 0.002)) return;
    if(!this.hatBuf){
      var rate = this.ctx.sampleRate, len = Math.floor(rate * 0.05);
      this.hatBuf = this.ctx.createBuffer(1, len, rate);
      var d = this.hatBuf.getChannelData(0);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    var s = this.ctx.createBufferSource(); s.buffer = this.hatBuf;
    var f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    var g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.musicGain || this.ctx.destination);
    s.start(t);
  },
  stopMusic:function(){
    var m = this.musicCtx;
    if(m && m.timer) clearTimeout(m.timer);
    this.musicCtx = null;
    if(this.musicGain && this.ctx){
      var g = this.musicGain, now = this.ctx.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0002, g.gain.value), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    }
  },
  toggleMusic:function(){
    this.musicOn = !this.musicOn;
    try{ localStorage.setItem('fsm_music', this.musicOn ? '1' : '0'); }catch(e){}
    if(this.musicOn){ this.startMusic(); this.click(); }
    else { this.stopMusic(); this.click(); }
  },
  /* 首次用户手势唤醒（浏览器自动播放策略） */
  kick:function(){
    this.init();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} }
    if(this.musicOn && !this.musicCtx) this.startMusic();
  }
};
try{ var _mm = localStorage.getItem('fsm_music'); if(_mm !== null) Audio2.musicOn = (_mm === '1'); }catch(e){}

function drawCharImg(img, x, y, w, h){
  if(img && img.complete && img.naturalWidth > 0){
    ctx.drawImage(img, x, y, w, h);
    return true;
  }
  return false;
}
/* 兜底：图没加载出来时用程序化画一个，保证永远不空白 */
function drawFallbackCat(x, y, w, h){
  ctx.save();
  ctx.fillStyle = '#e9e9ef';
  ctx.beginPath(); ctx.ellipse(x + w/2, y + h*0.55, w*0.30, h*0.26, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w*0.24, y + h*0.40); ctx.lineTo(x + w*0.32, y + h*0.20);
  ctx.lineTo(x + w*0.42, y + h*0.38); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w*0.76, y + h*0.40); ctx.lineTo(x + w*0.68, y + h*0.20);
  ctx.lineTo(x + w*0.58, y + h*0.38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5ec2f0';
  ctx.beginPath(); ctx.ellipse(x + w*0.41, y + h*0.52, w*0.05, h*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.59, y + h*0.52, w*0.05, h*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f2909f';
  ctx.beginPath(); ctx.moveTo(x + w*0.47, y + h*0.62); ctx.lineTo(x + w*0.53, y + h*0.62);
  ctx.lineTo(x + w*0.50, y + h*0.66); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawFallbackOwl(x, y, w, h){
  ctx.save();
  ctx.fillStyle = '#ffd45e';
  ctx.beginPath(); ctx.ellipse(x + w/2, y + h*0.52, w*0.28, h*0.28, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7fc96a';
  ctx.beginPath(); ctx.ellipse(x + w*0.26, y + h*0.55, w*0.11, h*0.20, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.74, y + h*0.55, w*0.11, h*0.20, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(x + w*0.41, y + h*0.48, w*0.08, h*0.09, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.59, y + h*0.48, w*0.08, h*0.09, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2f2a26';
  ctx.beginPath(); ctx.ellipse(x + w*0.41, y + h*0.49, w*0.035, h*0.04, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.59, y + h*0.49, w*0.035, h*0.04, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff9a4d';
  ctx.beginPath(); ctx.moveTo(x + w*0.47, y + h*0.56); ctx.lineTo(x + w*0.53, y + h*0.56);
  ctx.lineTo(x + w*0.50, y + h*0.63); ctx.closePath(); ctx.fill();

}
function drawCat(x, y, w, h){
  if(!drawCharImg(CAT_IMG, x, y, w, h)) drawFallbackCat(x, y, w, h);

/* ============================================================
 * 5. 游戏清单 + 难度配置
 * ========================================================== */
/* mode 决定菜单下半部分显示哪个选择器：
   'level' = 三档难度（简单/普通/困难）
   'grid'  = 棋盘尺寸（翻牌没有难度概念，牌多就难，所以直接给尺寸选） */
var GAMES = [
  /* drag:true 表示这个游戏靠手指拖动操作，pointermove 才会跟手；
     翻牌不设，手指划过屏幕会误翻一排骨牌。 */
  { id:'acorn',  name:'接 橡 果', who:'owl', mode:'level', drag:true, desc:'涂涂滑翔接橡果',
    tip:'左右移动接住掉落的橡果，连击有加成' },
  { id:'memory', name:'记 忆 翻 牌', who:'both', mode:'grid', desc:'找出一样的动物',
    tip:'翻开两张，一样的就配对成功' }
];

var DIFFS = [
  { id:'easy',   name:'简 单', color:'#4caf6d', dark:'#2f7a46' },
  { id:'normal', name:'普 通', color:'#4a90d9', dark:'#2b6bb0' },
  { id:'hard',   name:'困 难', color:'#f28c28', dark:'#c26a12' }
];

/* 翻牌的棋盘尺寸。cols × rows 必须是偶数才能两两配对，
   所以只给 4×3(12张) / 4×4(16张) / 5×4(20张) / 6×4(24张) 这四档。
   base 是计分基数：牌越多越费时，基分给高一点，四档之间才有可比性。 */
var GRIDS = [
  { id:'g43', name:'4 × 3', cols:4, rows:3, base:1000, color:'#4caf6d', dark:'#2f7a46' },
  { id:'g44', name:'4 × 4', cols:4, rows:4, base:1200, color:'#4a90d9', dark:'#2b6bb0' },
  { id:'g54', name:'5 × 4', cols:5, rows:4, base:1500, color:'#9b6bd6', dark:'#7644ad' },
  { id:'g64', name:'6 × 4', cols:6, rows:4, base:1800, color:'#f28c28', dark:'#c26a12' }
];

/* 当前游戏该用哪个选择器 */
function optsList(g){ return (g && g.mode === 'grid') ? GRIDS : DIFFS; }

var Game = {
  state:'menu',          /* menu / play / result */

  diff:'easy',           /* 当前游戏的当前档位，是 diffs 的镜像，游戏逻辑都读它 */

   旧版三档共用一个 fsm_best_<game>：接橡果 easy 档橡果落得慢（vy 2.1）几乎打不死，
   随手刷个 800 分之后，normal / hard 就再也打不出「新纪录」了 ——
   孩子唯一的长期激励直接失效。 */
function bestKey(id, diff){ return id + '_' + (diff || Game.diff); }

/* 难度/尺寸按游戏分开存：翻牌存的是 'g44' 这种尺寸 id，
   接橡果存 'easy'。共用一把钥匙的话，在翻牌里选完 6×4 再切到接橡果，
   ACORN_CFG['g64'] 会是 undefined，一进游戏就崩。 */
function loadDiff(){
  try{
    GAMES.forEach(function(g){
      var d = localStorage.getItem('fsm_diff_' + g.id);
      Game.diffs[g.id] = d || optsList(g)[0].id;
    });
  }catch(e){}
  normalizeDiff();
}
/* 兜底：存档里的值若不在当前游戏的选择器里（游戏被删过、选项表改过、
   或旧版本留下的脏值），回退到第一项 —— 否则配置表会查出 undefined 直接崩。 */
function normalizeDiff(){
  var list = optsList(curGame());
  var cur = Game.diffs[Game.gameId];
  var ok = false;
  for(var i = 0; i < list.length; i++) if(list[i].id === cur) ok = true;
  if(!ok) cur = list[0].id;
  Game.diffs[Game.gameId] = cur;
  Game.diff = cur;
}
function saveDiff(){
  try{ localStorage.setItem('fsm_diff_' + Game.gameId, Game.diff); }catch(e){}
}
/* 切游戏 / 切档位都走这两个函数，保证 diffs 和 diff 始终同步 */
function selectGame(id){
  Game.gameId = id;
  normalizeDiff();
}
function selectDiff(did){
  Game.diff = did;
  Game.diffs[Game.gameId] = did;
  saveDiff();
}

function loadBest(){
  try{
    GAMES.forEach(function(g){
      var list = optsList(g);
      var hasNew = false;
      list.forEach(function(o){
        var raw = localStorage.getItem('fsm_best_' + g.id + '_' + o.id);
        var v = parseInt(raw || '0', 10);
        Game.best[bestKey(g.id, o.id)] = isNaN(v) ? 0 : v;
        if(raw !== null) hasNew = true;
      });
      /* 迁移：旧存档只有一个 fsm_best_<game>。只有在没有任何按档位的新键时，
         才把旧值搬给当前档位，避免孩子的纪录被清零；只搬当前一档，
         防止把简单档刷出来的高分污染其他档（那正是要修的 bug）。 */
      if(!hasNew){
        var old = parseInt(localStorage.getItem('fsm_best_' + g.id) || '0', 10);
        if(!isNaN(old) && old > 0){
          Game.best[bestKey(g.id, Game.diff)] = old;
          localStorage.setItem('fsm_best_' + bestKey(g.id, Game.diff), String(old));
        }
      }
    });
  }catch(e){}
}
loadDiff();
loadBest();

function saveBest(id, score){
  var key = bestKey(id);
  if(score > (Game.best[key] || 0)){
    Game.best[key] = score;
    try{ localStorage.setItem('fsm_best_' + key, String(score)); }catch(e){}
    return true;
  }
  return false;
}

/* 卡片和按钮都按数量自适应宽度，加/减游戏或档位时不用重算坐标。
   卡片内容按 CARD_REF_W 等比缩放，避免变窄后溢出或字号缩到看不清。 */
var CARD_H = 230, CARD_Y = 118, CARD_MARGIN = 26;
var CARD_REF_W = 250;
function cardMetrics(){
  var n = GAMES.length;
  var gap = n >= 4 ? 22 : 45;
  var w = Math.min(CARD_REF_W, Math.floor((W - CARD_MARGIN * 2 - gap * (n - 1)) / n));
  return { w:w, gap:gap, x0:(W - (w * n + gap * (n - 1))) / 2 };
}
function cardRect(i){
  var m = cardMetrics();
  return { x: m.x0 + i * (m.w + m.gap), y: CARD_Y, w: m.w, h: CARD_H };
}

/* 档位按钮：三档难度时 170 宽，翻牌的四个尺寸选项窄一点才放得下 */
var DIFF_H = 56, DIFF_Y = 372, DIFF_MARGIN = 30;
function diffMetrics(){
  var n = optsList(curGame()).length;
  var gap = n >= 4 ? 18 : 30;
  var w = Math.min(170, Math.floor((W - DIFF_MARGIN * 2 - gap * (n - 1)) / n));
  return { w:w, gap:gap, x0:(W - (w * n + gap * (n - 1))) / 2 };
}
function diffRect(i){
  var m = diffMetrics();
  return { x: m.x0 + i * (m.w + m.gap), y: DIFF_Y, w: m.w, h: DIFF_H };
}

function musicRect(){ return { x:14, y:14, w:56, h:56 }; }

}

/* ============================================================
 * 8. 游戏一：接橡果（涂涂滑翔）
 * ========================================================== */
var ACORN_CFG = {
  easy:   { vy:2.1, gap:74, maxNuts:2, lives:5, moveSpd:7.5 },
  normal: { vy:3.1, gap:54, maxNuts:3, lives:3, moveSpd:8.5 },
  hard:   { vy:4.3, gap:40, maxNuts:4, lives:2, moveSpd:9.5 }
};
var Acorn = { owlX:0, owlVx:0, nuts:[], lives:0, maxLives:0, combo:0, best:0, spawnT:0, hurt:0, catchFx:[] };

function startAcorn(){
  var c = ACORN_CFG[Game.diff];
  Acorn.owlX = W / 2; Acorn.owlVx = 0;
  Acorn.nuts = []; Acorn.catchFx = [];
  Acorn.lives = c.lives; Acorn.maxLives = c.lives;
  Acorn.combo = 0; Acorn.best = 0;
  Acorn.spawnT = 40; Acorn.hurt = 0;
  Game.score = 0; Game.banner = 90;
}
function updateAcorn(dt){
  var c = ACORN_CFG[Game.diff];
  if(Acorn.hurt > 0) Acorn.hurt -= dt;

  /* 移动：键盘或指针目标 */
  var target = Input.pointX;
  var kb = 0;
  if(Input.keys['arrowleft'] || Input.keys['a']) kb -= 1;
  if(Input.keys['arrowright'] || Input.keys['d']) kb += 1;
  if(kb !== 0){
    Acorn.owlVx = kb * c.moveSpd;
    Input.pointX = null;
  }else if(target !== null && target !== undefined){
    var d = target - Acorn.owlX;
    Acorn.owlVx = clamp(d * 0.22, -c.moveSpd * 1.6, c.moveSpd * 1.6);
  }else{
    /* 指数衰减而不是逐帧乘常数：否则 120Hz 上阻尼被算两遍，手感变黏 */
    Acorn.owlVx *= Math.pow(0.82, dt);
  }
  Acorn.owlX = clamp(Acorn.owlX + Acorn.owlVx * dt, 40, W - 40);

  /* 生成橡果 */
  Acorn.spawnT -= dt;
  if(Acorn.spawnT <= 0 && Acorn.nuts.length < c.maxNuts){
    Acorn.nuts.push({ x: rnd(60, W - 60), y: -30, vy: c.vy * rnd(0.88, 1.14), rot: rnd(0, 6.28), vr: rnd(-0.08, 0.08), swing: rnd(0, 6.28) });
    Acorn.spawnT = c.gap * rnd(0.75, 1.25);
  }

  /* 橡果下落与判定 */
  var owlY = 424;
  for(var i = Acorn.nuts.length - 1; i >= 0; i--){
    var n = Acorn.nuts[i];
    n.y += n.vy * dt; n.rot += n.vr * dt; n.swing += 0.06 * dt;
    n.x += Math.sin(n.swing) * 0.7 * dt;
    if(n.y > owlY - 26 && n.y < owlY + 46 && Math.abs(n.x - Acorn.owlX) < 52){
      Acorn.nuts.splice(i, 1);
      Acorn.combo++;
      if(Acorn.combo > Acorn.best) Acorn.best = Acorn.combo;
      var gain = 10 + Math.min(40, (Acorn.combo - 1) * 3);
      Game.score += gain;
      Audio2.good(Acorn.combo);
      Acorn.catchFx.push({ x:n.x, y:owlY - 10, life:26, txt:'+' + gain });
      continue;
    }
    if(n.y > H + 30){
      Acorn.nuts.splice(i, 1);
      Acorn.combo = 0;
      Acorn.lives--;
      Acorn.hurt = 18;
      Audio2.bad();
      if(Acorn.lives <= 0){
        endGame(Game.score, '最高连击 ' + Acorn.best);
        return;
      }
    }
  }
  for(var f = Acorn.catchFx.length - 1; f >= 0; f--){
    Acorn.catchFx[f].life -= dt;
    Acorn.catchFx[f].y -= 1.2 * dt;
    if(Acorn.catchFx[f].life <= 0) Acorn.catchFx.splice(f, 1);
  }
}
function drawAcorn(){
  drawBackdrop(Game.time * 60, 0);

  /* 接取范围提示 */
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Acorn.owlX - 52, 468); ctx.lineTo(Acorn.owlX + 52, 468);
  ctx.stroke(); ctx.setLineDash([]);

  /* 橡果 */
  for(var i = 0; i < Acorn.nuts.length; i++){
    var n = Acorn.nuts[i];
    ctx.save();
    ctx.translate(n.x, n.y); ctx.rotate(n.rot);
    ctx.fillStyle = '#a9703f';
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a5a30';
    ctx.beginPath(); ctx.ellipse(-4, -3, 3.5, 6, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b4522';
    roundRect(-8, -18, 16, 7, 3); ctx.fill();
    ctx.fillRect(-1.5, -22, 3, 6);
    ctx.restore();
  }

  /* 涂涂（滑翔姿态） */
  var oy = 424 + Math.sin(Game.time * 4) * 3;
  ctx.save();
  var tilt = clamp(Acorn.owlVx * 0.02, -0.28, 0.28);
  ctx.translate(Acorn.owlX, oy); ctx.rotate(tilt);
  if(Acorn.hurt > 0){ ctx.globalAlpha = 0.45 + Math.sin(Game.time * 40) * 0.3; }
  var flap = Math.sin(Game.time * 6) * 8;
  if(!drawCharImg(OWL_IMG, -52, -58 - flap * 0.2, 104, 108)) drawFallbackOwl(-52, -58, 104, 108);
  /* 翅膀 */
  ctx.fillStyle = 'rgba(242,185,60,.85)';
  ctx.beginPath(); ctx.ellipse(-46, -18, 22, 11, -0.5 - flap * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(46, -18, 22, 11, 0.5 + flap * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  /* 飘字 */
  for(var f = 0; f < Acorn.catchFx.length; f++){
    var fx = Acorn.catchFx[f];
    ctx.globalAlpha = clamp(fx.life / 26, 0, 1);
    ctx.fillStyle = '#1f4d2e';
    ctx.font = '500 18px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'central';
    ctx.fillText(fx.txt, fx.x, fx.y);
    ctx.globalAlpha = 1;
  }

  drawTopBar('接橡果');
  drawHearts(Acorn.lives, Acorn.maxLives);
  if(Acorn.combo >= 3){
    ctx.fillStyle = '#d8952a';
    ctx.font = '500 20px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'central';
    ctx.fillText('连击 ×' + Acorn.combo, W / 2, 66);
  }
}

/* ============================================================
 * 10. 游戏三：记忆翻牌
 * ========================================================== */
/* 翻牌没有「难度」概念，牌多就难 —— 所以直接在菜单上选几×几（GRIDS，见 p2）。
   base 是计分基数：牌越多越费时，基分给高一点，四种尺寸之间才有可比性。
   查不到就退回最小的 4×3，别让配置查出一个 undefined 把游戏搞崩。 */
function gridCfg(){
  for(var i = 0; i < GRIDS.length; i++) if(GRIDS[i].id === Game.diff) return GRIDS[i];
  return GRIDS[0];
}
var ANIMALS = [
  { fur:'#e9e9ef', ear:'pointy', eye:'#5ec2f0', nose:'#f2909f' },
  { fur:'#ffd45e', ear:'none',   eye:'#ffffff', beak:true },
  { fur:'#f09048', ear:'pointy', eye:'#3a2a1e', white:true },
  { fur:'#fbf7f2', ear:'long',   eye:'#e8798a', nose:'#e8798a' },
  { fur:'#b07a48', ear:'round',  eye:'#33261c', nose:'#33261c', tail:true },
  { fur:'#7fc96a', ear:'frog',   eye:'#ffffff', wide:true },
  { fur:'#8a6b4f', ear:'spike',  eye:'#2f2a26', nose:'#2f2a26' },
  { fur:'#5aa9e6', ear:'none',   eye:'#ffffff', beak:true, small:true },
  { fur:'#b8bcc4', ear:'round',  eye:'#2f2a26', mask:true },
  { fur:'#f6f4ef', ear:'panda',  eye:'#2f2a26', panda:true },
  { fur:'#f4b8c4', ear:'pointy', eye:'#5a3a44', pig:true },
  { fur:'#a9713f', ear:'round',  eye:'#2f2a26', snout:true }
];
function drawAnimalFace(cx, cy, s, k){
  var a = ANIMALS[k % ANIMALS.length];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  /* 耳朵 */
  ctx.fillStyle = a.fur;
  if(a.ear === 'pointy'){
    ctx.beginPath(); ctx.moveTo(-26, -18); ctx.lineTo(-30, -48); ctx.lineTo(-8, -30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26, -18); ctx.lineTo(30, -48); ctx.lineTo(8, -30); ctx.closePath(); ctx.fill();
  }else if(a.ear === 'round'){
    ctx.beginPath(); ctx.ellipse(-25, -30, 12, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25, -30, 12, 12, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.ear === 'long'){
    ctx.beginPath(); ctx.ellipse(-15, -44, 8, 22, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(15, -44, 8, 22, -0.15, 0, Math.PI*2); ctx.fill();
  }else if(a.ear === 'spike'){
    for(var q = 0; q < 7; q++){
      var ang = Math.PI + q * (Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 28, Math.sin(ang) * 28);
      ctx.lineTo(Math.cos(ang + 0.22) * 44, Math.sin(ang + 0.22) * 44);
      ctx.lineTo(Math.cos(ang + 0.44) * 28, Math.sin(ang + 0.44) * 28);
      ctx.closePath(); ctx.fill();
    }
  }else if(a.ear === 'frog'){
    ctx.beginPath(); ctx.ellipse(-20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.ear === 'panda'){
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.ellipse(-25, -30, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25, -30, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = a.fur;
  }
  /* 脸 */
  ctx.fillStyle = a.fur;
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 30, 0, 0, Math.PI*2); ctx.fill();
  if(a.white){
    ctx.fillStyle = '#fbf7f2';
    ctx.beginPath(); ctx.ellipse(0, 12, 18, 13, 0, 0, Math.PI*2); ctx.fill();
  }
  if(a.mask){
    ctx.fillStyle = '#3a3f47';
    ctx.fillRect(-30, -8, 60, 15);
  }
  if(a.panda){
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.ellipse(0, 0, 32, 30, 0, 0, Math.PI*2); ctx.fill();
  }
  /* 眼睛 */
  var ey = a.ear === 'frog' ? -22 : -4;
  if(a.ear === 'frog'){
    ctx.fillStyle = a.fur;
    ctx.beginPath(); ctx.ellipse(-20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
  }
  if(!a.panda){
    ctx.fillStyle = a.eye;
    ctx.beginPath(); ctx.ellipse(-12, ey, 8, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, ey, 8, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = a.ear === 'frog' ? '#2f2a26' : '#2f2a26';
    ctx.beginPath(); ctx.ellipse(-12, ey, 4, 4.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, ey, 4, 4.5, 0, 0, Math.PI*2); ctx.fill();
  }else{
    ctx.fillStyle = '#f6f4ef';
    ctx.beginPath(); ctx.ellipse(-12, -4, 9, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -4, 9, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.ellipse(-12, -4, 5, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -4, 5, 5.5, 0, 0, Math.PI*2); ctx.fill();
  }
  /* 嘴 / 鼻 */
  if(a.beak){
    ctx.fillStyle = '#ff9a4d';
    ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(8, 8); ctx.lineTo(0, 20); ctx.closePath(); ctx.fill();
  }else if(a.wide){
    ctx.strokeStyle = '#3f7a34'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 8, 17, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }else if(a.pig){
    ctx.fillStyle = '#e88fa4';
    ctx.beginPath(); ctx.ellipse(0, 12, 12, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c96b82';
    ctx.beginPath(); ctx.ellipse(-4, 12, 2.4, 3.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, 12, 2.4, 3.4, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.snout){
    ctx.fillStyle = '#f0d9b8';
    ctx.beginPath(); ctx.ellipse(0, 12, 13, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3f2a';
    ctx.beginPath(); ctx.ellipse(0, 11, 4, 3.2, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.nose){
    ctx.fillStyle = a.nose;
    ctx.beginPath(); ctx.moveTo(-5, 8); ctx.lineTo(5, 8); ctx.lineTo(0, 15); ctx.closePath(); ctx.fill();
  }else{
    ctx.strokeStyle = 'rgba(60,50,45,.6)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 12); ctx.quadraticCurveTo(0, 18, 8, 12); ctx.stroke();
  }
  if(a.tail){
    ctx.fillStyle = a.fur;
    ctx.beginPath(); ctx.ellipse(34, 18, 15, 20, 0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

var Mem = { cards:[], cols:4, rows:3, cw:0, ch:0, x0:0, y0:0, first:-1, flips:0, matched:0, lockT:0, el:0 };

function startMemory(){
  var c = gridCfg();
  Mem.cols = c.cols; Mem.rows = c.rows;
  var pairs = Math.floor(Mem.cols * Mem.rows / 2);
  var deck = [];
  for(var i = 0; i < pairs; i++){ deck.push(i); deck.push(i); }
  for(var s = deck.length - 1; s > 0; s--){
    var j = rndInt(0, s); var t = deck[s]; deck[s] = deck[j]; deck[j] = t;
  }
  Mem.cards = deck.map(function(k){ return { k:k, open:false, done:false, anim:0 }; });
  Mem.first = -1; Mem.flips = 0; Mem.matched = 0; Mem.lockT = 0; Mem.el = 0;
  var maxW = W - 120, maxH = 300;
  Mem.cw = Math.min(110, Math.floor(maxW / Mem.cols) - 10);
  Mem.ch = Math.min(96, Math.floor(maxH / Mem.rows) - 8);
  Mem.x0 = (W - (Mem.cw + 10) * Mem.cols + 10) / 2;
  Mem.y0 = 150;
  Game.score = 0; Game.banner = 90;
}
function memRect(i){
  var r = Math.floor(i / Mem.cols), c = i % Mem.cols;
  return { x: Mem.x0 + c * (Mem.cw + 10), y: Mem.y0 + r * (Mem.ch + 8), w: Mem.cw, h: Mem.ch };
}
function updateMemory(dt){
  Mem.el += dt;
  if(Mem.lockT > 0){
    Mem.lockT -= dt;
    if(Mem.lockT <= 0){
      var a = Mem.cards[Mem.first], b = Mem.cards[Mem._second];
      if(a && b){
        if(a.k === b.k){ a.done = true; b.done = true; Mem.matched += 2; Audio2.match(); }
        else { a.open = false; b.open = false; }
      }
      Mem.first = -1; Mem._second = -1;
      if(Mem.matched >= Mem.cards.length){
        var base = gridCfg().base;
        /* Mem.el 累加的是帧数（dtF = dtSec * 60），不是秒。
           这里漏了 /60 就变成每秒扣 240 分，4 秒即跌到下限 50 —— 每局都是 50 分，
           saveBest 第一局之后再也触发不了「新纪录」。计分公式按秒写，就得按秒换算。 */
        var timePenalty = Math.floor(Mem.el / 60 * 4);
        var flipPenalty = Math.max(0, Mem.flips - Mem.cards.length) * 6;
        Game.score = Math.max(50, base - timePenalty - flipPenalty);
        endGame(Game.score, '用了 ' + Math.floor(Mem.el / 60) + ' 秒 · 翻了 ' + Mem.flips + ' 次');
      }
    }
  }
  for(var i = 0; i < Mem.cards.length; i++){
    var cd = Mem.cards[i];
    if(cd.open || cd.done){ if(cd.anim < 1) cd.anim = Math.min(1, cd.anim + dt * 0.18); }
    else { if(cd.anim > 0) cd.anim = Math.max(0, cd.anim - dt * 0.18); }
  }
}
function drawMemory(){
  drawBackdrop(Game.time * 60, 0);
  for(var i = 0; i < Mem.cards.length; i++){
    var cd = Mem.cards[i], r = memRect(i);
    if(cd.done){
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,109,.7)'; ctx.lineWidth = 2.5;
      roundRect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
      ctx.globalAlpha = 0.55;
      drawAnimalFace(r.x + r.w/2, r.y + r.h/2 + 2, Math.min(r.w, r.h) / 78, cd.k);
      ctx.globalAlpha = 1;
      continue;
    }
    var flip = cd.anim;
    ctx.save();
    ctx.translate(r.x + r.w/2, r.y + r.h/2);
    /* 翻牌动画：背面(flip=0)宽度1 → 中线(flip=0.5)宽度0 → 正面(flip=1)宽度1。
       之前用 cos(flip * π/2)，flip=1 时变成 0，卡片会压成一条细线，
       导致翻开后"看不到"。改用 cos(flip * π) 取绝对值即可。 */
    var sq = Math.abs(Math.cos(flip * Math.PI));
    ctx.scale(Math.max(0.06, sq), 1);
    if(flip < 0.5){
      ctx.fillStyle = '#6fb85c';
      roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
      roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.78)';
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.quadraticCurveTo(16, -4, 0, 16);
      ctx.quadraticCurveTo(-16, -4, 0, -14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(80,120,80,.6)';
      ctx.fillRect(-1.5, -14, 3, 26);
    }else{
      ctx.fillStyle = '#fbf8ee';
      roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(120,140,120,.5)'; ctx.lineWidth = 2;
      roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.stroke();
      drawAnimalFace(0, 2, Math.min(r.w, r.h) / 78, cd.k);
    }
    ctx.restore();
  }
  drawTopBar('记忆翻牌');
  ctx.fillStyle = 'rgba(31,77,46,.72)';
  ctx.font = '400 14px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'central';
  ctx.fillText('已配对 ' + (Mem.matched / 2) + ' / ' + (Mem.cards.length / 2) +
               '    翻牌 ' + Mem.flips + ' 次', W / 2, 66);
}

/* ============================================================
 * 11. 游戏注册表挂接
 * ------------------------------------------------------------
 * 把每个游戏的 start / update / draw / tap / banner 挂到 GAMES 上，
 * 主循环和输入都改成按 id 查表分发（见 p4）。以后新增小游戏只要在
 * GAMES 里 push 一条并挂上这几个字段，不用再动主循环的 if/else 链。
 * ========================================================== */
(function(){
  var impl = {
    acorn:  { start:startAcorn,   update:updateAcorn,   draw:drawAcorn,
              banner:'← → 或手指拖动，移动涂涂接橡果',
              tap:function(x, y){ Input.pointX = x; } },
    memory: { start:startMemory,  update:updateMemory,  draw:drawMemory,
              banner:'点开两张，一样的动物就配对成功',
              tap:function(x, y){
                if(Mem.lockT > 0) return;
                for(var c = 0; c < Mem.cards.length; c++){
                  var cd = Mem.cards[c];
                  if(cd.done || cd.open) continue;
                  if(hitRect(x, y, memRect(c))){
                    cd.open = true; Mem.flips++; Audio2.flip();
                    if(Mem.first < 0) Mem.first = c;
                    else { Mem._second = c; Mem.lockT = 34; }
                    return;
                  }
                }
              } }
  };
  for(var i = 0; i < GAMES.length; i++){
    var m = impl[GAMES[i].id];
    if(m){
      GAMES[i].start = m.start; GAMES[i].update = m.update; GAMES[i].draw = m.draw;
      GAMES[i].banner = m.banner; GAMES[i].tap = m.tap;
    }
  }
})();


/* ============================================================
 * 11. 输入
 * ------------------------------------------------------------
 * 所有游戏相关的分支都走查表（curGame()），这里只管「输入 → 分发」。
 * 新增小游戏不用改本文件的任何 if/else。
 * ========================================================== */
var Input = { keys:{}, pointX:null, down:false, startY:0, touch:false };

function toLogic(cx, cy){
  var r = canvas.getBoundingClientRect();
  return { x:(cx - r.left) / (r.width / W), y:(cy - r.top) / (r.height / H) };
}

window.addEventListener('keydown', function(e){
  Audio2.init(); Audio2.kick();
  var k = e.key.toLowerCase();
  if([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  if(Input.keys[k]) return;
  Input.keys[k] = true;

  if(Game.state === 'menu'){
    /* 数字键选游戏：1~N，N 随 GAMES.length 自动变化，加游戏不用改这里 */
    var num = parseInt(k, 10);
    if(!isNaN(num) && num >= 1 && num <= GAMES.length){
      selectGame(GAMES[num - 1].id); Audio2.click();
    }else if(k === 'arrowleft' || k === 'a'){
      var list = optsList(curGame());
      var i = (optsIndex() + list.length - 1) % list.length;
      selectDiff(list[i].id); Audio2.click();
    }else if(k === 'arrowright' || k === 'd'){
      var list2 = optsList(curGame());
      var j = (optsIndex() + 1) % list2.length;
      selectDiff(list2[j].id); Audio2.click();
    }else if(k === ' ' || k === 'enter'){
      Audio2.click(); startCurrent();
    }
  }else if(Game.state === 'result'){
    if(k === ' ' || k === 'enter'){ Audio2.click(); startCurrent(); }
    else if(k === 'escape'){ Audio2.click(); Game.state = 'menu'; }
  }else{
    if(k === 'escape'){ Audio2.click(); Game.state = 'menu'; }
  }
});
window.addEventListener('keyup', function(e){ Input.keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', function(){ Input.keys = {}; Input.pointX = null; Input.down = false; });

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  Audio2.init(); Audio2.kick();
  var p = toLogic(e.clientX, e.clientY);
  Input.down = true; Input.startY = p.y;
  if(e.pointerType && e.pointerType !== 'mouse') Input.touch = true;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}

  if(Game.state === 'menu'){
    if(hitRect(p.x, p.y, musicRect())){ Audio2.toggleMusic(); return; }
    if(hitRect(p.x, p.y, linkRect())){ Audio2.click(); openRunner(); return; }
    for(var i = 0; i < GAMES.length; i++){
      if(hitRect(p.x, p.y, cardRect(i))){
        selectGame(GAMES[i].id); Audio2.click();
        startCurrent(); return;
      }
    }
    var opts = optsList(curGame());
    for(var d = 0; d < opts.length; d++){
      if(hitRect(p.x, p.y, diffRect(d))){
        selectDiff(opts[d].id); Audio2.click(); return;
      }
    }
  }else if(Game.state === 'result'){
    if(hitRect(p.x, p.y, musicRect())){ Audio2.toggleMusic(); return; }
    if(hitRect(p.x, p.y, againRect())){ Audio2.click(); startCurrent(); return; }
    if(hitRect(p.x, p.y, homeRect())){ Audio2.click(); Game.state = 'menu'; return; }
  }else{
    if(hitRect(p.x, p.y, musicRect())){ Audio2.toggleMusic(); return; }
    var b = backRect(); b.x = 80;
    if(hitRect(p.x, p.y, b)){ Audio2.click(); Game.state = 'menu'; return; }

    /* 游戏内点击：交给该游戏自己的 tap 处理（在 p3 的注册表里挂上） */
    var gt = curGame();
    if(gt.tap) gt.tap(p.x, p.y);
  }
});

canvas.addEventListener('pointermove', function(e){
  if(e.pointerType && e.pointerType !== 'mouse') Input.touch = true;
  /* 只有需要拖动的游戏（接橡果）才跟手指，翻牌跟手会误翻 */
  if(Game.state !== 'play' || !curGame().drag) return;
  var p = toLogic(e.clientX, e.clientY);
  if(Input.down) Input.pointX = p.x;
});
canvas.addEventListener('pointerup', function(){
  Input.down = false;
  if(curGame().drag) Input.pointX = null;
});
canvas.addEventListener('pointercancel', function(){ Input.down = false; Input.pointX = null; });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

function startCurrent(){
  /* 按 id 查表分发：新增小游戏只要在 GAMES 上挂好 start，这里不用动 */
  var g = curGame();
  if(g.start) g.start();
  Game.state = 'play';
  Input.pointX = null;
}

/* ============================================================
 * 12. 开场提示横幅
 * ========================================================== */
function bannerText(){
  /* 查表：每个游戏在 GAMES 里自带 banner 文案，加游戏不用改这里 */
  var g = curGame();
  return g.banner || g.tip || '';
}
function drawBanner(){
  if(Game.banner <= 0) return;
  var a = clamp(Game.banner / 30, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(20,40,30,.72)';
  roundRect(W/2 - 300, 122, 600, 44, 22); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '400 15px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'central';
  ctx.fillText(bannerText(), W/2, 144);
  ctx.globalAlpha = 1;
}

/* ============================================================
 * 13. 主循环
 * ========================================================== */
var lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  var dtSec = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  Game.time += dtSec;
  var dtF = dtSec * 60;

  if(Game.state === 'play'){
    if(Game.banner > 0) Game.banner = Math.max(0, Game.banner - dtF);
    var gu = curGame();
    if(gu.update) gu.update(dtF);
  }

  ctx.clearRect(0, 0, W, H);
  if(Game.state === 'menu') drawMenu();
  else if(Game.state === 'result') drawResult();
  else {
    var gd = curGame();
    if(gd.draw) gd.draw();
  }

  if(Game.state === 'play') drawBanner();
}

/* ============================================================
 * 14. 启动
 * ========================================================== */
/* 手动步进表：给诊断脚本脱离 rAF 快进用，直接从 GAMES 生成 */
var stepMap = {};
GAMES.forEach(function(g){ if(g.update) stepMap[g.id] = g.update; });

window.__fsm = {
  Game:Game, Audio2:Audio2, Input:Input,
  GAMES:GAMES, DIFFS:DIFFS, GRIDS:GRIDS,
  Acorn:Acorn, Mem:Mem,
  optsList:optsList, selectGame:selectGame, selectDiff:selectDiff, curGame:curGame,
  startCurrent:startCurrent, endGame:endGame, gridCfg:gridCfg,
  diffName:diffName, optsIndex:optsIndex,
  cardRect:cardRect, diffRect:diffRect, musicRect:musicRect, linkRect:linkRect,
  againRect:againRect, homeRect:homeRect, memRect:memRect,
  openRunner:openRunner,
  _step:stepMap
};

resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
