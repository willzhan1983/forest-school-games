<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>森林学校 · 课间十分钟</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B0</text></svg>">
<!-- PWA：加到手机主屏后全屏打开、断网也能玩（校园 WiFi 不稳时尤其管用） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6fb85c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="课间十分钟">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#6fb85c;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  body{display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  #wrap{position:relative;line-height:0;}
  #game{display:block;touch-action:none;background:#bfe8f7;border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,.28);}
  /* 提示条用 fixed 钉在视口底部，不放画布里。
     两道坑都踩过：① 放画布顶部（top:8px）会盖住主标题；
     ② 放画布底部又会压住难度按钮 —— 竖屏时画布被压扁到 236px 高居中显示，
     画布底边正好落在难度按钮上。挪到视口底部（画布外的留白区）才两不耽误。 */
  #tip{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%);
    background:rgba(28,44,36,.86);color:#fff;font-size:14px;line-height:1.5;
    padding:7px 8px 7px 16px;border-radius:999px;white-space:nowrap;
    display:none;align-items:center;gap:10px;z-index:20;}
  /* 关闭按钮撑到 44px 高 —— 触控最小命中区（Apple HIG）。
     之前 12px 字 + 5px 内边距，手机上只有 20px 出头，小孩根本点不中。 */
  #tip button{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:14px;
    padding:0 16px;min-height:44px;border-radius:999px;cursor:pointer;
    font-family:inherit;-webkit-appearance:none;}
  /* 屏幕阅读器专用文本：canvas 里画的东西读屏软件一个字也读不到，
     关键状态得同步到这个 aria-live 区域，视觉上完全隐藏。 */
  #sr{position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540" tabindex="0" role="application"
    aria-label="森林学校课间十分钟，三个小游戏：接橡果、记忆翻牌、找不同。键盘按 1 2 3 选游戏，左右方向键选档位，空格开始，Esc 返回菜单。"></canvas>
  <div id="sr" aria-live="polite" aria-atomic="true"></div>
</div>
<!-- 提示条在 #wrap 外面：放进画布容器会挡住画布里的按钮 -->
<div id="tip"><span>横屏玩更舒服，也可以继续竖屏</span><button id="tipClose">知道了</button></div>
<script>
(function(){
'use strict';

/* ============================================================
 * 1. 基础常量与画布
 * ========================================================== */
/* 逻辑画布尺寸。横屏 16:9 (960×540)，竖屏 9:16 (540×960)——
 * 这是 PR #12 起的核心改动。竖屏再死守 16:9 的话画布只剩 1/4 屏幕，
 * 菜单和游戏元素都被压扁到没法玩。横屏坐标按 (W,H) 自然映射游戏元素位置
 * （owl W/2, nut rnd(60,W-60)），竖屏相当于把 W/H 角色对调。 */
var W = 960, H = 540;
var W_BASE = 960, H_BASE = 540;  /* 横屏基准，用于字号/图标尺寸的"原始"参考 */
var VIEW = { s:1, portrait:false, dpr:1 };
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var tipEl = document.getElementById('tip');
var tipClose = document.getElementById('tipClose');

function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var availW = window.innerWidth, availH = window.innerHeight;
  /* 横屏用 960×540，竖屏切 540×960。1.15 是宽松比例阈值（短边=长边就触发）
     —— 之前是给 1280×720 那种"接近横屏但略高"留余地的，逻辑不变。 */
  var portrait = (availH > availW * 1.15);
  W = portrait ? 540 : W_BASE;
  H = portrait ? 960 : H_BASE;
  var s = Math.min(availW / W, availH / H);
  s = Math.max(0.08, Math.min(s, 1.6));
  var cssW = Math.round(W * s), cssH = Math.round(H * s);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  /* transform 用当前 W/H 而非 BASE——竖屏下是 540×960 坐标空间 */
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
  VIEW.s = s; VIEW.dpr = dpr; VIEW.portrait = portrait;
  if(portrait && availW < 760){
    tipEl.style.display = 'flex';
    clearTimeout(resize._t);
    resize._t = setTimeout(function(){ tipEl.style.display = 'none'; }, 4000);
  }else{
    tipEl.style.display = 'none';
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });
if(tipClose) tipClose.addEventListener('click', function(){ tipEl.style.display = 'none'; });

/* ============================================================
 * 2. 绘图工具
 * ========================================================== */
function roundRect(x, y, w, h, r){
  if(w < 2 * r) r = w / 2;
  if(h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function rnd(a, b){ return a + Math.random() * (b - a); }
function rndInt(a, b){ return Math.floor(rnd(a, b + 1)); }
function hitRect(x, y, r){ return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

/* 鼠标悬停判定。触屏没有 hover 这回事（手指离屏后不留鼠标位置），
   所以 Input.touch 为真时一律 false，免得点一下之后按钮一直亮着。 */
function hoverRect(r){
  if(Input.touch) return false;
  if(Input.mx === null || Input.mx === undefined) return false;
  return hitRect(Input.mx, Input.my, r);
}
/* 按钮不透明度：选中 1、悬停 0.92、其余 0.78。
   之前未选中给 0.55，淡得像被禁用了 —— 小朋友第一眼会以为只有「简单」能选。 */
function btnAlpha(sel, r){
  if(sel) return 1;
  return hoverRect(r) ? 0.92 : 0.78;
}

/* 触控最小热区。逻辑坐标要除以当前缩放比 s 才是屏幕 CSS 像素：
   960 宽的画布缩到 390 宽的手机上，s≈0.41，一个 100×50 的按钮
   实际只有 41×20 CSS 像素 —— 远低于 44px 的触屏命中标准（Apple HIG）。
   视觉大小不变，只在命中判定时向外扩。 */
function padRect(r, minCss){
  var need = (minCss || 44) / Math.max(VIEW.s, 0.0001);
  var dx = Math.max(0, (need - r.w) / 2), dy = Math.max(0, (need - r.h) / 2);
  return { x:r.x - dx, y:r.y - dy, w:r.w + dx * 2, h:r.h + dy * 2 };
}

/* 森林主题背景（天空 + 远山 + 草地） */
function drawBackdrop(t, night){
  /* 草地线、远山基线等都按 H 比例算。横屏 H=540 草地=0.74=400；竖屏 H=960
     草地=710（猫头鹰、橡果下落的地面）。之前 400 是硬编码，竖屏会留 560 像素的
     纯色块在草地下边，特别丑。 */
  var GROUND = H * 0.74;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, night > 0.3 ? '#5d7fa8' : '#bfe8f7');
  g.addColorStop(0.62, night > 0.3 ? '#8aa3c0' : '#e8f6ec');
  g.addColorStop(1, night > 0.3 ? '#9db08a' : '#d9f0c8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 远山：基线放在草地线略上 */
  var MTN_BASE = GROUND - 70;
  ctx.fillStyle = night > 0.3 ? 'rgba(70,92,120,.55)' : 'rgba(150,200,170,.55)';
  ctx.beginPath();
  ctx.moveTo(0, MTN_BASE);
  for(var i = 0; i <= 8; i++){
    ctx.lineTo(i * (W / 8), MTN_BASE - Math.sin(i * 1.1) * 44 - 20);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  /* 远处树影 */
  var TREE_Y = GROUND - 48;
  ctx.fillStyle = night > 0.3 ? 'rgba(52,78,64,.45)' : 'rgba(120,180,130,.42)';
  for(var k = 0; k < 7; k++){
    var tx = ((k * 167 + t * 6) % (W + 160)) - 80;
    ctx.beginPath();
    ctx.ellipse(tx, TREE_Y, 52, 40, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(tx - 6, TREE_Y, 12, 46);
  }

  /* 云 */
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for(var c = 0; c < 4; c++){
    var cx = ((c * 280 + t * 10) % (W + 240)) - 120;
    var cy = 60 + (c % 3) * 46;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 42, 20, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 34, cy + 5, 30, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 32, cy + 6, 26, 14, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 草地：基线 GROUND，上面起伏 7 像素、下面填到 H。 */
  ctx.fillStyle = night > 0.3 ? '#3f6b3a' : '#7fc96a';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = night > 0.3 ? '#4a7a44' : '#8fd06a';
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 8);
  for(var q = 0; q <= 16; q++){
    ctx.lineTo(q * (W / 16), GROUND + Math.sin(q * 0.9) * 7);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  if(night > 0.02){
    ctx.fillStyle = 'rgba(30,50,110,' + (night * 0.34) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* 通用按钮 */
function drawButton(r, label, fill, textColor, disabled){
  ctx.globalAlpha = disabled ? 0.45 : 1;
  ctx.fillStyle = fill;
  roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
  roundRect(r.x, r.y, r.w, r.h, 14); ctx.stroke();
  ctx.fillStyle = textColor;
  ctx.font = '500 22px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.globalAlpha = 1;
}

/* ============================================================
 * 3. 音频：Web Audio 实时合成（音效 + 循环 BGM）
 * ========================================================== */
var Audio2 = {
  enabled:true, ctx:null,
  musicOn:true, musicCtx:null, musicGain:null, hatBuf:null,
  /* C 大调五声音阶 32 步 A/B 句，与跑酷版同一首 */
  MUSIC_MEL:[
    392.00, 440.00, 523.25, 587.33, 659.25, 587.33, 523.25, 440.00,
    392.00, 440.00, 523.25, 659.25, 587.33, 523.25, 440.00, 392.00,
    523.25, 659.25, 783.99, 659.25, 587.33, 659.25, 523.25, 440.00,
    523.25, 587.33, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33
  ],
  MUSIC_BASS:[
    65.41, 65.41, 55.00, 55.00, 43.65, 43.65, 49.00, 49.00,
    65.41, 65.41, 43.65, 43.65, 49.00, 49.00, 49.00, 49.00
  ],

  init:function(){
    if(this.ctx || !this.enabled) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){ this.enabled = false; return; }
      this.ctx = new AC();
    }catch(e){ this.enabled = false; }
  },

  /* 基础音 */
  tone:function(freq, dur, type, vol, delay){
    if(!this.enabled) return;
    this.init();
    if(!this.ctx) return;
    var t0 = this.ctx.currentTime + (delay || 0);
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.16), t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.04);
  },

  click:function(){ this.tone(660, 0.09, 'triangle', 0.13); },
  good:function(n){
    var f = [523, 659, 784, 1047];
    var i = Math.min(3, (n || 1) - 1);
    this.tone(f[i], 0.16, 'triangle', 0.17);
    this.tone(f[i] * 1.5, 0.12, 'sine', 0.07, 0.05);
  },
  bad:function(){ this.tone(180, 0.26, 'sawtooth', 0.13); this.tone(120, 0.3, 'sine', 0.1, 0.03); },
  flip:function(){ this.tone(520, 0.07, 'square', 0.07); },
  match:function(){ this.tone(659, 0.14, 'triangle', 0.15); this.tone(988, 0.2, 'sine', 0.1, 0.07); },
  win:function(){
    var self = this;
    [523, 659, 784, 1046].forEach(function(f, i){ self.tone(f, 0.2, 'triangle', 0.15, i * 0.1); });
  },
  over:function(){
    var self = this;
    [440, 370, 294, 220].forEach(function(f, i){ self.tone(f, 0.24, 'sawtooth', 0.11, i * 0.12); });
  },

  /* ---- 循环 BGM ---- */
  startMusic:function(){
    if(!this.enabled || !this.musicOn || this.musicCtx) return;
    this.init();
    if(!this.ctx) return;
    if(!this.musicGain){
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.0001;
      this.musicGain.connect(this.ctx.destination);
    }
    var now = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(now);
    this.musicGain.gain.setValueAtTime(Math.max(0.0002, this.musicGain.gain.value), now);
    this.musicGain.gain.exponentialRampToValueAtTime(0.85, now + 0.7);
    this.musicCtx = { startTime:now + 0.15, beat:0.42, next:0 };
    this._schedMusic();
  },
  _schedMusic:function(){
    if(!this.musicCtx || !this.ctx) return;
    var self = this, m = this.musicCtx, now = this.ctx.currentTime;
    var lookahead = 1.0;
    while(m.startTime + m.next * m.beat < now + lookahead){
      var i = m.next;
      var t = m.startTime + i * m.beat;
      var f = this.MUSIC_MEL[i % 32];
      this._musicNote(f, t, m.beat * 0.92, 0.048, 'triangle');
      if(i % 2 === 0){
        this._musicNote(this.MUSIC_BASS[(i / 2) % 16], t, m.beat * 1.7, 0.078, 'sine');
      }
      this._musicHat(t, i % 2 === 0 ? 0.028 : 0.013);
      m.next++;
    }
    m.timer = setTimeout(function(){ self._schedMusic(); }, 200);
  },
  _musicNote:function(freq, t, dur, vol, type){
    if(!this.ctx) return;
    var o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.musicGain || this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  _musicHat:function(t, vol){
    if(!this.ctx || !(vol > 0.002)) return;
    if(!this.hatBuf){
      var rate = this.ctx.sampleRate, len = Math.floor(rate * 0.05);
      this.hatBuf = this.ctx.createBuffer(1, len, rate);
      var d = this.hatBuf.getChannelData(0);
      for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    var s = this.ctx.createBufferSource(); s.buffer = this.hatBuf;
    var f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    var g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.musicGain || this.ctx.destination);
    s.start(t);
  },
  stopMusic:function(){
    var m = this.musicCtx;
    if(m && m.timer) clearTimeout(m.timer);
    this.musicCtx = null;
    if(this.musicGain && this.ctx){
      var g = this.musicGain, now = this.ctx.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0002, g.gain.value), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    }
  },
  toggleMusic:function(){
    this.musicOn = !this.musicOn;
    try{ localStorage.setItem('fsm_music', this.musicOn ? '1' : '0'); }catch(e){}
    if(this.musicOn){ this.startMusic(); this.click(); }
    else { this.stopMusic(); this.click(); }
  },
  /* 首次用户手势唤醒（浏览器自动播放策略） */
  kick:function(){
    this.init();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} }
    if(this.musicOn && !this.musicCtx) this.startMusic();
  }
};
try{ var _mm = localStorage.getItem('fsm_music'); if(_mm !== null) Audio2.musicOn = (_mm === '1'); }catch(e){}

/* ============================================================
 * 3. 屏幕阅读器播报
 * ------------------------------------------------------------
 * 画面是 canvas 画的，读屏软件一个字也读不到。把菜单选择、
 * 开局玩法、结算分数同步到一个 aria-live 区域，才有基本的可访问性。
 * srTick() 每帧调用，靠 srLast 去重，只有文本真变了才碰 DOM。
 * ========================================================== */
var srEl = document.getElementById('sr');
var srLast = '';
function announce(txt){
  if(!srEl || txt === srLast) return;
  srLast = txt;
  srEl.textContent = txt;
}
function srTick(){
  if(Game.state === 'menu'){
    var g = curGame();
    announce('菜单：' + g.name + '，' + (g.mode === 'grid' ? '棋盘' : '难度') +
             diffName() + '，最高分 ' + (Game.best[bestKey(g.id, Game.diffs[g.id])] || 0));
  }else if(Game.state === 'result'){
    announce('本局 ' + Game.score + ' 分' +
             (resultInfo.isNew ? '，新纪录' : '，最高分 ' + (Game.best[bestKey(Game.gameId)] || 0)));
  }else{
    announce('开始：' + curGame().name + '。' + bannerText());
  }
}

/* Service Worker：缓存住页面，断网也能玩。
   只在 https（或 localhost）下注册，file:// 打开时静默跳过。 */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  });
}


/* ============================================================

  return false;
}

  ctx.lineTo(x + w*0.58, y + h*0.38); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5ec2f0';
  ctx.beginPath(); ctx.ellipse(x + w*0.41, y + h*0.52, w*0.05, h*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.59, y + h*0.52, w*0.05, h*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f2909f';
  ctx.beginPath(); ctx.moveTo(x + w*0.47, y + h*0.62); ctx.lineTo(x + w*0.53, y + h*0.62);
  ctx.lineTo(x + w*0.50, y + h*0.66); ctx.closePath(); ctx.fill();
  ctx.restore();
}

  ctx.beginPath(); ctx.ellipse(x + w*0.59, y + h*0.49, w*0.035, h*0.04, 0, 0, Math.PI*2); ctx.fill();

/* ============================================================
 * 5. 游戏清单 + 难度配置
 * ========================================================== */
/* mode 决定菜单下半部分显示哪个选择器：
   'level' = 三档难度（简单/普通/困难）
   'grid'  = 棋盘尺寸（翻牌没有难度概念，牌多就难，所以直接给尺寸选） */
var GAMES = [
  /* drag:true 表示这个游戏靠手指拖动操作，pointermove 才会跟手；
     翻牌不设，手指划过屏幕会误翻一排骨牌。 */
  { id:'acorn',  name:'接 橡 果', who:'owl', mode:'level', drag:true, desc:'涂涂滑翔接橡果',
    tip:'左右移动接住掉落的橡果，连击有加成' },
  { id:'memory', name:'记 忆 翻 牌', who:'both', mode:'grid', desc:'找出一样的动物',
    tip:'翻开两张，一样的就配对成功' },
  /* 找不同走三档难度（DIFFS），和翻牌的棋盘尺寸（GRIDS）不是一回事 */
  { id:'spot',   name:'找 不 同', who:'both', mode:'level', desc:'两幅图里找不同',
    tip:'找出两幅图不一样的地方' }
];

var DIFFS = [
  { id:'easy',   name:'简 单', color:'#4caf6d', dark:'#2f7a46' },
  { id:'normal', name:'普 通', color:'#4a90d9', dark:'#2b6bb0' },
  { id:'hard',   name:'困 难', color:'#f28c28', dark:'#c26a12' }
];

/* 翻牌的棋盘尺寸。cols × rows 必须是偶数才能两两配对，
   所以只给 4×3(12张) / 4×4(16张) / 5×4(20张) / 6×4(24张) 这四档。
   base 是计分基数：牌越多越费时，基分给高一点，四档之间才有可比性。 */
var GRIDS = [
  { id:'g43', name:'4 × 3', cols:4, rows:3, base:1000, color:'#4caf6d', dark:'#2f7a46' },
  { id:'g44', name:'4 × 4', cols:4, rows:4, base:1200, color:'#4a90d9', dark:'#2b6bb0' },
  { id:'g54', name:'5 × 4', cols:5, rows:4, base:1500, color:'#9b6bd6', dark:'#7644ad' },
  { id:'g64', name:'6 × 4', cols:6, rows:4, base:1800, color:'#f28c28', dark:'#c26a12' }
];

/* 当前游戏该用哪个选择器 */
function optsList(g){ return (g && g.mode === 'grid') ? GRIDS : DIFFS; }

var Game = {
  state:'menu',          /* menu / play / result */
  gameId:'acorn',
  diff:'easy',           /* 当前游戏的当前档位，是 diffs 的镜像，游戏逻辑都读它 */
  diffs:{},              /* 每个游戏各记各的：{ acorn:'easy', memory:'g44' } */
  score:0,
  time:0,
  best:{},               /* 键形如 'acorn_hard' / 'memory_g44'，见 bestKey() */
  banner:0,
  flash:0
};

/* 最高分按「游戏 × 难度/尺寸」分开存。
   旧版三档共用一个 fsm_best_<game>：接橡果 easy 档橡果落得慢（vy 2.1）几乎打不死，
   随手刷个 800 分之后，normal / hard 就再也打不出「新纪录」了 ——
   孩子唯一的长期激励直接失效。 */
function bestKey(id, diff){ return id + '_' + (diff || Game.diff); }

/* 难度/尺寸按游戏分开存：翻牌存的是 'g44' 这种尺寸 id，
   接橡果存 'easy'。共用一把钥匙的话，在翻牌里选完 6×4 再切到接橡果，
   ACORN_CFG['g64'] 会是 undefined，一进游戏就崩。 */
function loadDiff(){
  try{
    GAMES.forEach(function(g){
      var d = localStorage.getItem('fsm_diff_' + g.id);
      Game.diffs[g.id] = d || optsList(g)[0].id;
    });
  }catch(e){}
  normalizeDiff();
}
/* 兜底：存档里的值若不在当前游戏的选择器里（游戏被删过、选项表改过、
   或旧版本留下的脏值），回退到第一项 —— 否则配置表会查出 undefined 直接崩。 */
function normalizeDiff(){
  var list = optsList(curGame());
  var cur = Game.diffs[Game.gameId];
  var ok = false;
  for(var i = 0; i < list.length; i++) if(list[i].id === cur) ok = true;
  if(!ok) cur = list[0].id;
  Game.diffs[Game.gameId] = cur;
  Game.diff = cur;
}
function saveDiff(){
  try{ localStorage.setItem('fsm_diff_' + Game.gameId, Game.diff); }catch(e){}
}
/* 切游戏 / 切档位都走这两个函数，保证 diffs 和 diff 始终同步 */
function selectGame(id){
  Game.gameId = id;
  normalizeDiff();
}
function selectDiff(did){
  Game.diff = did;
  Game.diffs[Game.gameId] = did;
  saveDiff();
}

function loadBest(){
  try{
    GAMES.forEach(function(g){
      var list = optsList(g);
      var hasNew = false;
      list.forEach(function(o){
        var raw = localStorage.getItem('fsm_best_' + g.id + '_' + o.id);
        var v = parseInt(raw || '0', 10);
        Game.best[bestKey(g.id, o.id)] = isNaN(v) ? 0 : v;
        if(raw !== null) hasNew = true;
      });
      /* 迁移：旧存档只有一个 fsm_best_<game>。只有在没有任何按档位的新键时，
         才把旧值搬给当前档位，避免孩子的纪录被清零；只搬当前一档，
         防止把简单档刷出来的高分污染其他档（那正是要修的 bug）。 */
      if(!hasNew){
        var old = parseInt(localStorage.getItem('fsm_best_' + g.id) || '0', 10);
        if(!isNaN(old) && old > 0){
          Game.best[bestKey(g.id, Game.diff)] = old;
          localStorage.setItem('fsm_best_' + bestKey(g.id, Game.diff), String(old));
        }
      }
    });
  }catch(e){}
}
loadDiff();
loadBest();

function saveBest(id, score){
  var key = bestKey(id);
  if(score > (Game.best[key] || 0)){
    Game.best[key] = score;
    try{ localStorage.setItem('fsm_best_' + key, String(score)); }catch(e){}
    return true;
  }
  return false;
}

/* ============================================================
 * 6. 菜单布局与绘制
 * ========================================================== */
/* 卡片和按钮都按数量自适应宽度，加/减游戏或档位时不用重算坐标。
   卡片内容按 CARD_REF_W 等比缩放，避免变窄后溢出或字号缩到看不清。 */
var CARD_H = 230, CARD_Y = 118, CARD_MARGIN = 26;
var CARD_REF_W = 250;
function cardMetrics(){
  if(VIEW.portrait){
    /* 竖屏：1 列 3 行，纵向堆叠。W=540, padding 40, gap 14, cardH 200。
       卡片比横屏矮 30px，drawMenu 里相应压缩字号 + 缩小角色。 */
    var w = W - 80, x0 = 40, h = 200, gap = 14, y0 = 130;
    return { w:w, gap:gap, x0:x0, h:h, y0:y0, ncol:1 };
  }
  var n = GAMES.length;
  var gap = n >= 4 ? 22 : 45;
  var w = Math.min(CARD_REF_W, Math.floor((W - CARD_MARGIN * 2 - gap * (n - 1)) / n));
  return { w:w, gap:gap, x0:(W - (w * n + gap * (n - 1))) / 2, h:CARD_H, y0:CARD_Y, ncol:n };
}
function cardRect(i){
  var m = cardMetrics();
  if(VIEW.portrait){
    return { x: m.x0, y: m.y0 + i * (m.h + m.gap), w: m.w, h: m.h };
  }
  return { x: m.x0 + i * (m.w + m.gap), y: m.y0, w: m.w, h: m.h };
}

/* 档位按钮：三档难度时 170 宽，翻牌的四个尺寸选项窄一点才放得下 */
var DIFF_H = 56, DIFF_Y = 372, DIFF_MARGIN = 30;
function diffMetrics(){
  var n = optsList(curGame()).length;
  if(VIEW.portrait){
    /* 竖屏：放在卡片下方，三个按钮仍 1 行 3 列撑满。W=540, padding 30,
       gap 16, w=160。位置 y 由 diffMetrics 之外的常量算 —— 卡片最后一行
       底部 y0 + 3*h + 2*gap = 130 + 3*200 + 2*14 = 758，再 +22 = 780。 */
    var gap = 16, x0 = 30, w = Math.floor((W - 60 - gap * (n - 1)) / n);
    return { w:w, gap:gap, x0:x0, y:780, h:DIFF_H };
  }
  var gap = n >= 4 ? 18 : 30;
  var w = Math.min(170, Math.floor((W - DIFF_MARGIN * 2 - gap * (n - 1)) / n));
  return { w:w, gap:gap, x0:(W - (w * n + gap * (n - 1))) / 2, y:DIFF_Y, h:DIFF_H };
}
function diffRect(i){
  var m = diffMetrics();
  return { x: m.x0 + i * (m.w + m.gap), y: m.y, w: m.w, h: m.h };
}

function musicRect(){ return { x:14, y:14, w:56, h:56 }; }
function linkRect(){
  if(VIEW.portrait) return { x:W - 96 - 14, y:14, w:96, h:44 };
  return { x:850, y:14, w:96, h:44 };
}

function drawMusicBtn(r){
  var on = Audio2.musicOn;
  /* 底色就是状态：开=实心绿，关=半透明灰。
     之前只靠"音符淡一点 + 一条细斜杠"区分，实测两态亮度只差 0.8，
     小朋友根本看不出来。改成整块换底色，一眼分辨。 */
  ctx.fillStyle = on ? 'rgba(76,175,109,.95)' : 'rgba(255,255,255,.22)';
  roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
  ctx.strokeStyle = on ? '#2f7a46' : 'rgba(255,255,255,.6)';
  ctx.lineWidth = 2;
  roundRect(r.x, r.y, r.w, r.h, 12); ctx.stroke();

  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if(on){
    /* 音符 + 两道声波（表示正在响） */
    ctx.beginPath();
    ctx.ellipse(r.x + 23, r.y + 35, 5.5, 4, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(r.x + 27, r.y + 35); ctx.lineTo(r.x + 27, r.y + 19);
    ctx.moveTo(r.x + 27, r.y + 19); ctx.lineTo(r.x + 35, r.y + 23);
    ctx.stroke();
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(r.x + 37, r.y + 31, 5, -1.0, 1.0); ctx.stroke();
    ctx.beginPath(); ctx.arc(r.x + 37, r.y + 31, 10, -1.0, 1.0); ctx.stroke();
  }else{
    /* 灰化音符 + 醒目红斜杠 */
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.ellipse(r.x + 26, r.y + 34, 6, 4, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(r.x + 30, r.y + 34); ctx.lineTo(r.x + 30, r.y + 18);
    ctx.moveTo(r.x + 30, r.y + 18); ctx.lineTo(r.x + 38, r.y + 22);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(r.x + 16, r.y + 18); ctx.lineTo(r.x + 44, r.y + 46);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if(hoverRect(r)) hoverRing(r, 12);
}

function drawLinkBtn(r){
  /* 菜单页右上角：跳转回跑酷篇。
     文字带 ↗ 角标 —— 光秃秃一个「放学跑酷」，看不出是跳走还是切换 */
  var hov = hoverRect(r);
  ctx.fillStyle = hov ? 'rgba(96,164,236,.98)' : 'rgba(74,144,217,.95)';
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.strokeStyle = '#2b6bb0'; ctx.lineWidth = hov ? 3 : 2;
  roundRect(r.x, r.y, r.w, r.h, 10); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '500 16px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('放学跑酷 ↗', r.x + r.w / 2, r.y + r.h / 2 + 1);
  if(hov) hoverRing(r, 10);
}

/* 鼠标悬停时在按钮外圈描一道白边。
   canvas 里没有 :hover，不画反馈的话桌面端完全看不出按钮能点。 */
function hoverRing(r, rad){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
  roundRect(r.x - 3, r.y - 3, r.w + 6, r.h + 6, rad + 2); ctx.stroke();
  ctx.restore();
}

/* 掉落道具：AI 位图优先，没加载好就矢量兜底。
   (cx,cy) 是中心，h 是绘制高度，宽度按素材比例算 —— 三张素材宽高比不一样，
   统一按高度定尺寸才不会有的胖有的瘦。 */
function drawItemImg(kind, cx, cy, h, rot){
  var img = ITEM_IMG[kind];
  var w = h * (ITEM_AR[kind] || 0.85);
  ctx.save();
  ctx.translate(cx, cy);
  if(rot) ctx.rotate(rot);
  if(img && img.complete && img.naturalWidth > 0){
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
  }else{
    drawFallbackItem(kind, w, h);
  }
  ctx.restore();
}

/* 矢量兜底：全部用 w/h 的比例写，任意尺寸都不会变形 */
function drawFallbackItem(kind, w, h){
  if(kind === 'bug'){
    /* 毛毛虫：一串圆珠 + 触角 + 一对大眼睛 */
    ctx.fillStyle = '#7cc24a';
    for(var i = 0; i < 5; i++){
      var bx = -w * 0.30 + i * w * 0.15, by = Math.sin(i * 1.1) * h * 0.05;
      ctx.beginPath(); ctx.arc(bx, by, w * 0.13, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#4d8a2c'; ctx.lineWidth = Math.max(1, w * 0.035); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-w * 0.30, -h * 0.10); ctx.lineTo(-w * 0.36, -h * 0.30);
    ctx.moveTo(-w * 0.30, -h * 0.10); ctx.lineTo(-w * 0.20, -h * 0.28);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-w * 0.14, -h * 0.06, w * 0.075, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.04, -h * 0.06, w * 0.075, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.arc(-w * 0.13, -h * 0.05, w * 0.038, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.05, -h * 0.05, w * 0.038, 0, Math.PI * 2); ctx.fill();
    return;
  }
  if(kind === 'shroom'){
    /* 毒蘑菇：红伞 + 白点 + 浅柄 */
    ctx.fillStyle = '#e8ddc8';
    roundRect(-w * 0.14, -h * 0.02, w * 0.28, h * 0.42, w * 0.06); ctx.fill();
    ctx.fillStyle = '#d8443c';
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.44, h * 0.30, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.44, h * 0.08, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#fdf6e6';
    ctx.beginPath(); ctx.arc(-w * 0.20, -h * 0.14, w * 0.075, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.10, -h * 0.22, w * 0.065, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.26, -h * 0.09, w * 0.055, 0, Math.PI * 2); ctx.fill();
    return;
  }
  /* 橡果 */
  ctx.fillStyle = '#a9703f';
  ctx.beginPath(); ctx.ellipse(0, 0, w * 0.50, h * 0.50, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a5a30';
  ctx.beginPath(); ctx.ellipse(-w * 0.18, -h * 0.11, w * 0.16, h * 0.21, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#6b4522';
  roundRect(-w * 0.36, -h * 0.64, w * 0.73, h * 0.25, h * 0.10); ctx.fill();
  ctx.fillRect(-w * 0.07, -h * 0.79, w * 0.14, h * 0.21);
}

/* 小橡果图标。接橡果卡片里只有一只猫头鹰，
   另外两张卡片都是猫 + 猫头鹰两只，视觉重量差一截，用它补上。 */
function drawAcornIcon(cx, cy, s){
  drawItemImg('acorn', cx, cy, 28 * s);
}

/* 卡片字号：按缩放比缩小，但不低于 min —— 加游戏后卡片变窄，
   纯等比缩放会把提示文字压到 7px 那种根本读不了的大小。 */
function cardFont(base, min, sc){ return Math.max(min, Math.round(base * sc)); }

function drawMenu(){
  drawBackdrop(Game.time * 60, 0);

  /* 标题区。横屏 62/92，竖屏 76/108（顶栏音乐+放学跑酷按钮占了顶部
     14-70 区域，标题下移不挡按钮；竖屏 H=960 给标题 30 字号后两侧空白多）。 */
  var titleY = VIEW.portrait ? 76 : 62;
  var subY = VIEW.portrait ? 108 : 92;
  var titleSize = VIEW.portrait ? 28 : 34;
  var subSize = VIEW.portrait ? 13 : 15;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1f4d2e';
  ctx.font = '500 ' + titleSize + 'px system-ui,sans-serif';
  ctx.fillText('森林学校 · 课间十分钟', W / 2, titleY);
  ctx.fillStyle = 'rgba(31,77,46,.72)';
  ctx.font = '400 ' + subSize + 'px system-ui,sans-serif';
  ctx.fillText(curGame().mode === 'grid' ? '选一个游戏，再挑棋盘多大' : '选一个游戏，再选个难度', W / 2, subY);

  for(var i = 0; i < GAMES.length; i++){
    var g = GAMES[i], r = cardRect(i);
    var sel = (Game.gameId === g.id);
    var hov = hoverRect(r);
    ctx.fillStyle = sel ? 'rgba(255,255,255,.94)' : (hov ? 'rgba(255,255,255,.88)' : 'rgba(255,255,255,.78)');
    roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
    ctx.strokeStyle = sel ? '#4caf6d' : (hov ? '#7fc96a' : 'rgba(60,80,70,.28)');
    ctx.lineWidth = sel ? 3.5 : (hov ? 2.5 : 1.5);
    roundRect(r.x, r.y, r.w, r.h, 16); ctx.stroke();

    var cx = r.x + r.w / 2;
    if(VIEW.portrait){
      /* 竖屏：横排布局——左角色（约 80×80），右文字（左对齐）。
         角色在卡片内垂直居中；文字块垂直偏上对齐，下方留位置给 tip。 */
      var sc = 0.78, charH = 105 * sc, charW = 104 * sc;
      var charX = r.x + 22;
      var charY = r.y + (r.h - charH) / 2 - 6;
      if(g.who === 'owl'){
        drawOwl(charX, charY, charW, charH);
        drawAcornIcon(charX + 64 * sc, charY + 66 * sc, 0.9 * sc);
      }else if(g.who === 'cat'){
        drawCat(charX, charY, charW, charH);
      }else{
        drawCat(charX, charY, 84 * sc, 96 * sc);
        drawOwl(charX + 84 * sc, charY, 84 * sc, 96 * sc);
      }
      /* 文字区：左对齐，从 charX + charW + 18 开始 */
      var tx = charX + charW + 18;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#20402c';
      ctx.font = '500 22px system-ui,sans-serif';
      ctx.fillText(g.name, tx, r.y + 56);
      ctx.fillStyle = 'rgba(32,64,44,.7)';
      ctx.font = '400 13px system-ui,sans-serif';
      ctx.fillText(g.desc, tx, r.y + 84);
      ctx.fillStyle = '#8a6d3b';
      ctx.font = '500 14px system-ui,sans-serif';
      ctx.fillText('最高分 ' + (Game.best[bestKey(g.id, Game.diffs[g.id])] || 0), tx, r.y + 110);
      if(sel){
        ctx.fillStyle = 'rgba(76,175,109,.16)';
        roundRect(tx - 4, r.y + 130, r.w - (tx - r.x) - 12, 56, 9); ctx.fill();
        ctx.fillStyle = '#2f7a46';
        ctx.font = '400 12px system-ui,sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(g.tip, tx + 4, r.y + 158);
        ctx.textBaseline = 'alphabetic';
      }
      continue;
    }

    /* 角色形象。卡片变窄时内容等比缩小，字号设下限保证还能读 */
    var sc = r.w / CARD_REF_W;
    if(g.who === 'owl'){
      drawOwl(cx - 62 * sc, r.y + 18, 104 * sc, 105 * sc);
      drawAcornIcon(cx + 66 * sc, r.y + 80, 0.95 * sc);
    }else if(g.who === 'cat'){
      drawCat(cx - 52 * sc, r.y + 18, 104 * sc, 105 * sc);
    }else{
      drawCat(cx - 88 * sc, r.y + 22, 84 * sc, 96 * sc);
      drawOwl(cx + 4 * sc, r.y + 22, 84 * sc, 96 * sc);
    }

    ctx.fillStyle = '#20402c';
    ctx.font = '500 ' + cardFont(23, 17, sc) + 'px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(g.name, cx, r.y + 148);

    ctx.fillStyle = 'rgba(32,64,44,.66)';
    ctx.font = '400 ' + cardFont(13, 11, sc) + 'px system-ui,sans-serif';
    ctx.fillText(g.desc, cx, r.y + 172);

    ctx.fillStyle = '#8a6d3b';
    ctx.font = '500 ' + cardFont(14, 11, sc) + 'px system-ui,sans-serif';
    /* 用这个游戏自己的档位去查最高分。之前直接拿全局 Game.diff，
       切到翻牌时它还是 'easy'，而翻牌的键是 'memory_g43' 这种，永远查不到、显示 0。 */
    ctx.fillText('最高分 ' + (Game.best[bestKey(g.id, Game.diffs[g.id])] || 0), cx, r.y + 200);

    if(sel){
      ctx.fillStyle = 'rgba(76,175,109,.16)';
      roundRect(r.x + 8, r.y + 206, r.w - 16, 18, 9); ctx.fill();
      ctx.fillStyle = '#2f7a46';
      ctx.font = '400 ' + cardFont(11, 10, sc) + 'px system-ui,sans-serif';
      ctx.fillText(g.tip, cx, r.y + 219);
    }
  }

  /* 档位选择器：接橡果是三档难度，翻牌是棋盘尺寸（牌多就难，所以直接选几×几） */
  var opts = optsList(curGame());
  var dm = diffMetrics();
  ctx.fillStyle = 'rgba(31,77,46,.8)';
  ctx.font = '400 16px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(curGame().mode === 'grid' ? '棋盘' : '难度', W / 2, dm.y - 12);
  for(var d = 0; d < opts.length; d++){
    var dd = opts[d], dr = diffRect(d);
    var on = (Game.diff === dd.id);
    var hov = hoverRect(dr);
    ctx.globalAlpha = btnAlpha(on, dr);
    ctx.fillStyle = on ? dd.color : (hov ? 'rgba(255,255,255,.94)' : 'rgba(255,255,255,.75)');
    roundRect(dr.x, dr.y, dr.w, dr.h, 12); ctx.fill();
    ctx.strokeStyle = on ? dd.dark : (hov ? dd.dark : 'rgba(60,80,70,.3)');
    ctx.lineWidth = (on || hov) ? 2.5 : 1.5;
    roundRect(dr.x, dr.y, dr.w, dr.h, 12); ctx.stroke();
    ctx.fillStyle = on ? '#ffffff' : '#33513f';
    ctx.font = '500 ' + (VIEW.portrait ? 18 : 20) + 'px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(dd.name, dr.x + dr.w / 2, dr.y + dr.h / 2 + 1);
    ctx.globalAlpha = 1;
  }

  drawMusicBtn(musicRect());
  drawLinkBtn(linkRect());

  /* 底部操作提示。横屏 13px 太小：手机上画布被缩到 0.41 倍，实际只有 5px。
     PR #11 提到 15px，竖屏 W=540 直接给 16。 */
  ctx.fillStyle = 'rgba(31,77,46,.6)';
  ctx.font = '400 ' + (VIEW.portrait ? 16 : 15) + 'px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  /* 数字键提示跟着游戏数量走，别再写死「1 2 3」 */
  var nums = GAMES.map(function(_, i){ return String(i + 1); }).join(' ');
  var grid = curGame().mode === 'grid';
  /* 竖屏下两行紧贴底部（H=960, 留 60px），横屏留 34/14 */
  if(VIEW.portrait){
    ctx.fillText('键盘：← → 选择 · 空格 确认 · ' + nums + ' 选游戏 · Esc 返回', W / 2, H - 38);
    ctx.fillText('触屏：点卡片选游戏，点' + (grid ? '棋盘' : '难度') + '，游戏中按屏幕提示操作', W / 2, H - 16);
  }else{
    ctx.fillText('键盘：← → 选择 · 空格 确认 / 动作 · ' + nums + ' 选游戏 · Esc 返回', W / 2, H - 34);
    ctx.fillText('触屏：点卡片选游戏，点' + (grid ? '棋盘' : '难度') + '，游戏中按屏幕提示操作', W / 2, H - 14);
  }
}

/* ============================================================
 * 7. 通用：难度配置读取 / 结算页
 * ========================================================== */
/* 档位索引 / 名称都按「当前游戏的选择器」查：
   接橡果走 DIFFS（简单/普通/困难），翻牌走 GRIDS（4×3 / 4×4 / 5×4 / 6×4）。
   写死 DIFFS 的话，翻牌的 'g44' 永远查不到，结算页会一直显示「简 单」。 */
function optsIndex(){
  var list = optsList(curGame());
  for(var i = 0; i < list.length; i++) if(list[i].id === Game.diff) return i;
  return 0;
}
function diffName(){
  var list = optsList(curGame());
  for(var i = 0; i < list.length; i++) if(list[i].id === Game.diff) return list[i].name;
  return list[0].name;
}
function curGame(){
  for(var i = 0; i < GAMES.length; i++) if(GAMES[i].id === Game.gameId) return GAMES[i];
  return GAMES[0];
}

function heartsBox(){ return { x: W - 20 - 150, y: 48, w: 150, h: 26 }; }

function againRect(){ return { x: W/2 - 210, y: 392, w: 200, h: 62 }; }

var resultInfo = { isNew:false, extra:'' };
