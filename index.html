/* ============================================================
 * 8. 游戏一：接橡果（涂涂滑翔）
 * ========================================================== */
/* 每档都有限时。之前三档都不限时，只要不漏就能一直玩下去，
   分数无限累计 —— 简单档橡果落得慢（vy 2.1）几乎打不死，
   随手刷个几千分之后，另外两档再也破不了纪录，长期激励直接失效。
   一局 30~60 秒，正好是「课间十分钟」里能玩一把的时长。 */
/* bad = 掉落物里坏东西的比例，penalty = 接到坏东西扣的分。
   难度不只体现在「落得更快」，还体现在「要分辨的东西更多」——
   简单档五分之一是坏的，困难档接近一半，孩子的注意力压力完全是两码事。 */
/* ramp = 局末速度相对开局速度的倍率。
   只提速度，不提坏东西比例 —— 分辨好坏已经占掉一大半注意力，
   后期再往上加判断量，孩子会直接放弃分辨、退化成纯碰运气。 */
var ACORN_CFG = {
  easy:   { vy:2.1, gap:74, maxNuts:2, lives:5, moveSpd:7.5, time:60, bad:0.20, penalty:8,  ramp:1.45 },
  normal: { vy:3.1, gap:54, maxNuts:3, lives:3, moveSpd:8.5, time:45, bad:0.34, penalty:12, ramp:1.60 },
  hard:   { vy:4.3, gap:40, maxNuts:4, lives:2, moveSpd:9.5, time:30, bad:0.46, penalty:16, ramp:1.75 }
};
/* 好东西只有橡果；坏东西是毛毛虫和毒蘑菇，接到扣分 */
var BAD_KINDS = ['bug', 'shroom'];
var RAMP_STEPS = 3;   /* 速度爬升分 3 档，每跨一档闪一次「加速啦！」 */
var Acorn = { owlX:0, owlVx:0, nuts:[], lives:0, maxLives:0, combo:0, best:0,
              spawnT:0, hurt:0, catchFx:[], left:0, timeLimit:0, dodged:0,
              lastBad:false, rampLv:0, flash:0 };

/* 掉落物尺寸按画布短边算。横屏 960×540、竖屏 540×960，两种朝向的短边都是 540，
   所以两边都是 48，不存在「竖屏道具挤成一团」。
   写成常数的话，将来改画布比例道具就会跟着失衡。 */
function itemSize(){ return Math.round(Math.min(W, H) * 0.089); }

/* 局内速度倍率：开局 1，局末爬到 c.ramp。
   已经掉在半空的也乘这个系数（不是生成时把速度定死），加速是全屏一起变快 ——
   否则会出现「新掉的飞快、老的还在慢慢飘」这种一眼假的画面。 */
function acornRamp(){
  var c = ACORN_CFG[Game.diff];
  if(!c || Acorn.timeLimit <= 0) return 1;
  var t = clamp(1 - Acorn.left / Acorn.timeLimit, 0, 1);
  return 1 + (c.ramp - 1) * t;
}

/* 结果页副标题：连击之外再报一下躲开几个坏东西，
   让「躲」这个新动作也有成就感，不然孩子只惦记着接。 */
function acornExtra(){
  return '最高连击 ' + Acorn.best + (Acorn.dodged > 0 ? ' · 躲开 ' + Acorn.dodged + ' 个' : '');
}

function startAcorn(){
  var c = ACORN_CFG[Game.diff];
  Acorn.owlX = W / 2; Acorn.owlVx = 0;
  Acorn.nuts = []; Acorn.catchFx = [];
  Acorn.lives = c.lives; Acorn.maxLives = c.lives;
  Acorn.combo = 0; Acorn.best = 0;
  Acorn.spawnT = 40; Acorn.hurt = 0;
  Acorn.dodged = 0; Acorn.lastBad = false;
  Acorn.rampLv = 0; Acorn.flash = 0;
  Acorn.left = c.time; Acorn.timeLimit = c.time;
  Game.score = 0; Game.banner = 90;
}
function updateAcorn(dt){
  var c = ACORN_CFG[Game.diff];
  if(Acorn.hurt > 0) Acorn.hurt -= dt;
  if(Acorn.flash > 0) Acorn.flash -= dt;

  /* 倒计时。dt 是帧步长（dtF = dtSec * 60），除以 60 才是秒 ——
     和找不同 updateSpot 里保持同一套换算。 */
  if(c.time > 0){
    Acorn.left = Math.max(0, Acorn.left - dt / 60);
    if(Acorn.left <= 0){
      endGame(Game.score, acornExtra());
      return;
    }
  }

  /* 难度爬升。速度倍率随时间线性走，生成的间隔同步收紧（落得更快 + 来得更密）。
     猫头鹰也跟着提速，但只跟六成 —— 让它比掉落物慢半拍，
     「追不上」的紧张感才有，全同步的话就纯粹是手速了。 */
  var ramp = acornRamp();
  if(Acorn.timeLimit > 0){
    var lv = clamp(Math.floor((1 - Acorn.left / Acorn.timeLimit) * RAMP_STEPS), 0, RAMP_STEPS - 1);
    if(lv > Acorn.rampLv){ Acorn.rampLv = lv; Acorn.flash = 70; }
  }

  /* 移动：键盘或指针目标 */
  var mspd = c.moveSpd * (1 + (ramp - 1) * 0.6);
  var target = Input.pointX;
  var kb = 0;
  if(Input.keys['arrowleft'] || Input.keys['a']) kb -= 1;
  if(Input.keys['arrowright'] || Input.keys['d']) kb += 1;
  if(kb !== 0){
    Acorn.owlVx = kb * mspd;
    Input.pointX = null;
  }else if(target !== null && target !== undefined){
    var d = target - Acorn.owlX;
    Acorn.owlVx = clamp(d * 0.22, -mspd * 1.6, mspd * 1.6);
  }else{
    /* 指数衰减而不是逐帧乘常数：否则 120Hz 上阻尼被算两遍，手感变黏 */
    Acorn.owlVx *= Math.pow(0.82, dt);
  }
  Acorn.owlX = clamp(Acorn.owlX + Acorn.owlVx * dt, 40, W - 40);

  /* 生成掉落物。坏东西按难度概率混进来，两种各占一半。
     连续两个都是坏的会很难受（刚躲开又来一个），所以加一条：
     上一个刚生成的是坏的，这一个就强制给好的，中间有喘息。 */
  Acorn.spawnT -= dt;
  if(Acorn.spawnT <= 0 && Acorn.nuts.length < c.maxNuts){
    var kind = 'acorn';
    if(!Acorn.lastBad && Math.random() < c.bad){
      kind = BAD_KINDS[Math.random() < 0.5 ? 0 : 1];
    }
    Acorn.lastBad = (kind !== 'acorn');
    /* vy 存的是这一颗的固有速度，跟 ramp 无关。
       加速统一在下落循环里乘 —— 乘两次会变成 ramp 的平方，快到没得玩。 */
    Acorn.nuts.push({
      x: rnd(60, W - 60), y: -30, vy: c.vy * rnd(0.88, 1.14), kind: kind,
      rot: kind === 'acorn' ? rnd(0, 6.28) : 0,
      vr: kind === 'acorn' ? rnd(-0.08, 0.08) : 0,
      swing: rnd(0, 6.28)
    });
    /* 间隔同步收紧。掉落更快的同时也更密，后半段才是真的手忙脚乱。 */
    Acorn.spawnT = (c.gap / ramp) * rnd(0.75, 1.25);
  }

  /* 下落与判定。owlY 用 H 的比例算：写死 424 的话，竖屏画布高 960，
     猫头鹰会悬在画面中间，橡果落到一半就看不见了。 */
  var owlY = Math.round(H * 0.785);
  for(var i = Acorn.nuts.length - 1; i >= 0; i--){
    var n = Acorn.nuts[i];
    n.y += n.vy * ramp * dt; n.rot += n.vr * dt; n.swing += 0.06 * dt;
    n.x += Math.sin(n.swing) * 0.7 * dt;
    var caught = n.y > owlY - 26 && n.y < owlY + 46 && Math.abs(n.x - Acorn.owlX) < 52;
    /* kind 缺省按好橡果算。少了这个兜底，任何漏写 kind 的掉落物
       （测试脚本手塞的、将来别的模式生成的）都会被当成坏东西扣分。 */
    var isGood = (n.kind || 'acorn') === 'acorn';
    if(caught && isGood){
      Acorn.nuts.splice(i, 1);
      Acorn.combo++;
      if(Acorn.combo > Acorn.best) Acorn.best = Acorn.combo;
      var gain = 10 + Math.min(40, (Acorn.combo - 1) * 3);
      Game.score += gain;
      Audio2.good(Acorn.combo);
      Acorn.catchFx.push({ x:n.x, y:owlY - 10, life:26, txt:'+' + gain, bad:false });
      continue;
    }
    if(caught){
      /* 接到坏东西：扣分 + 断连击 + 掉一条命。
         扣分但不让总分变负 —— 一上来就接到一个变成 -12，孩子看着会懵。 */
      Acorn.nuts.splice(i, 1);
      var lost = Math.min(Game.score, c.penalty);
      Game.score -= lost;
      Acorn.combo = 0;
      Acorn.lives--;
      Acorn.hurt = 26;
      Audio2.bad();
      Acorn.catchFx.push({ x:n.x, y:owlY - 10, life:32, txt:'-' + lost, bad:true });
      if(Acorn.lives <= 0){
        endGame(Game.score, acornExtra());
        return;
      }
      continue;
    }
    if(n.y > H + 30){
      Acorn.nuts.splice(i, 1);
      if(isGood){
        /* 漏掉好橡果才是失误 */
        Acorn.combo = 0;
        Acorn.lives--;
        Acorn.hurt = 18;
        Audio2.bad();
      }else{
        /* 坏东西落地 = 躲对了，只记个数，不奖分也不罚分 */
        Acorn.dodged++;
      }
      if(Acorn.lives <= 0){
        endGame(Game.score, acornExtra());
        return;
      }
    }
  }
  for(var f = Acorn.catchFx.length - 1; f >= 0; f--){
    Acorn.catchFx[f].life -= dt;
    Acorn.catchFx[f].y -= 1.2 * dt;
    if(Acorn.catchFx[f].life <= 0) Acorn.catchFx.splice(f, 1);
  }
}
/* 常驻图例：哪个能接、哪个不能碰。
   banner 几秒就消失了，可「分辨好坏」这件事整局都在用，
   所以直接把图例画在左上角时间下面，随时能瞄一眼。 */
function drawAcornLegend(){
  /* 图例比掉落物小一号：够认清是哪个，又不至于抢戏。
     掉落物放大后跟着从 24 提到 28，否则图例里的图标和天上掉的对不上号。 */
  var y = 124, ih = 28, slot = 30, x = 24;
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '500 13px system-ui,sans-serif';

  drawItemImg('acorn', x + slot / 2, y, ih);
  ctx.fillStyle = 'rgba(43,122,61,.92)';
  ctx.fillText('接住', x + slot + 2, y);
  var x2 = x + slot + 2 + ctx.measureText('接住').width + 16;

  drawItemImg('bug', x2 + slot / 2, y, ih);
  drawItemImg('shroom', x2 + slot + slot / 2, y, ih);
  ctx.fillStyle = 'rgba(192,57,43,.92)';
  ctx.fillText('别碰', x2 + slot * 2 + 2, y);
  ctx.restore();
}

/* 速度档位：三根递增的小竖杠，亮几根就是第几档。
   放在剩余时间右边 —— 「还有多久」和「现在多快」本就是一组信息。
   孩子不看数字，但看得懂「杠变多了就是要变快了」。 */
function drawSpeedPips(x, y, lv){
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(31,77,46,.62)';
  ctx.font = '400 12px system-ui,sans-serif';
  ctx.fillText('速度', x, y);
  var bx = x + ctx.measureText('速度').width + 7;
  for(var i = 0; i < RAMP_STEPS; i++){
    var bh = 6 + i * 4;
    ctx.fillStyle = i <= lv ? (lv >= 2 ? '#d0503f' : '#d8952a') : 'rgba(0,0,0,.16)';
    roundRect(bx + i * 8, y - bh / 2, 5, bh, 2); ctx.fill();
  }
  ctx.restore();
}

function drawAcorn(){
  drawBackdrop(Game.time * 60, 0);
  var owlY = Math.round(H * 0.785);

  /* 接取范围提示 */
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Acorn.owlX - 52, owlY + 44); ctx.lineTo(Acorn.owlX + 52, owlY + 44);
  ctx.stroke(); ctx.setLineDash([]);

  /* 掉落物。坏的画在稍微下面一点的阴影里，颜色本来就跳，
     再加一层淡光晕帮孩子在乱糟糟的背景里一眼认出来。 */
  for(var i = 0; i < Acorn.nuts.length; i++){
    var n = Acorn.nuts[i];
    var h = itemSize();
    if(n.kind !== 'acorn'){
      var w = h * ITEM_AR[n.kind];
      ctx.save();
      ctx.fillStyle = 'rgba(210,60,50,.16)';
      ctx.beginPath(); ctx.ellipse(n.x, n.y, w * 0.82, h * 0.62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      /* 坏东西不自转，用摆动代替，看着像虫子在爬 / 蘑菇在晃 */
      drawItemImg(n.kind, n.x, n.y, h, Math.sin(n.swing) * 0.16);
    }else{
      drawItemImg('acorn', n.x, n.y, h, n.rot);
    }
  }

  /* 涂涂（滑翔姿态） */
  var oy = owlY + Math.sin(Game.time * 4) * 3;
  ctx.save();
  var tilt = clamp(Acorn.owlVx * 0.02, -0.28, 0.28);
  ctx.translate(Acorn.owlX, oy); ctx.rotate(tilt);
  if(Acorn.hurt > 0){ ctx.globalAlpha = 0.45 + Math.sin(Game.time * 40) * 0.3; }
  var flap = Math.sin(Game.time * 6) * 8;
  if(!drawCharImg(OWL_IMG, -52, -58 - flap * 0.2, 104, 108)) drawFallbackOwl(-52, -58, 104, 108);
  /* 翅膀 */
  ctx.fillStyle = 'rgba(242,185,60,.85)';
  ctx.beginPath(); ctx.ellipse(-46, -18, 22, 11, -0.5 - flap * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(46, -18, 22, 11, 0.5 + flap * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  /* 飘字。扣分是红的、字号也大一号 —— 接错了要一眼看到后果 */
  for(var f = 0; f < Acorn.catchFx.length; f++){
    var fx = Acorn.catchFx[f];
    var lf = fx.bad ? 32 : 26;
    ctx.globalAlpha = clamp(fx.life / lf, 0, 1);
    ctx.fillStyle = fx.bad ? '#c0392b' : '#1f4d2e';
    ctx.font = '500 ' + (fx.bad ? 21 : 18) + 'px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fx.txt, fx.x, fx.y);
    ctx.globalAlpha = 1;
  }

  drawTopBar('接橡果');
  drawHearts(Acorn.lives, Acorn.maxLives);
  drawAcornLegend();

  /* 剩余时间。画在左上角、顶栏按钮下方（y=92），
     再往上会压到音乐/返回两个按钮上。最后 10 秒变红加大，孩子能感到紧迫。 */
  if(Acorn.timeLimit > 0){
    var low = Acorn.left <= 10;
    ctx.fillStyle = low ? '#d33' : 'rgba(31,77,46,.82)';
    ctx.font = '500 ' + (low ? 22 : 19) + 'px system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var tTxt = Math.ceil(Acorn.left) + ' 秒';
    ctx.fillText(tTxt, 24, 92);
    drawSpeedPips(24 + ctx.measureText(tTxt).width + 14, 92, Acorn.rampLv);
  }

  /* 跨档闪一次「加速啦！」。没这个提示的话速度是悄悄爬上去的，
     孩子只会觉得「怎么突然接不到了」，分不清是自己慢了还是游戏变难了。 */
  if(Acorn.flash > 0){
    var k = clamp(1 - Acorn.flash / 70, 0, 1);
    ctx.save();
    ctx.globalAlpha = clamp(Acorn.flash / 24, 0, 1);
    ctx.translate(W / 2, H * 0.30);
    ctx.scale(1 + k * 0.3, 1 + k * 0.3);
    ctx.font = '700 34px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText('加速啦！', 0, 0);
    ctx.fillStyle = '#c0392b';
    ctx.fillText('加速啦！', 0, 0);
    ctx.restore();
  }

  if(Acorn.combo >= 3){
    ctx.fillStyle = '#d8952a';
    ctx.font = '500 20px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('连击 ×' + Acorn.combo, W / 2, 66);
  }
}

/* ============================================================
 * 10. 游戏三：记忆翻牌
 * ========================================================== */
/* 翻牌没有「难度」概念，牌多就难 —— 所以直接在菜单上选几×几（GRIDS，见 p2）。
   base 是计分基数：牌越多越费时，基分给高一点，四种尺寸之间才有可比性。
   查不到就退回最小的 4×3，别让配置查出一个 undefined 把游戏搞崩。 */
function gridCfg(){
  for(var i = 0; i < GRIDS.length; i++) if(GRIDS[i].id === Game.diff) return GRIDS[i];
  return GRIDS[0];
}
var ANIMALS = [
  { fur:'#e9e9ef', ear:'pointy', eye:'#5ec2f0', nose:'#f2909f' },
  { fur:'#ffd45e', ear:'none',   eye:'#ffffff', beak:true },
  { fur:'#f09048', ear:'pointy', eye:'#3a2a1e', white:true },
  { fur:'#fbf7f2', ear:'long',   eye:'#e8798a', nose:'#e8798a' },
  { fur:'#b07a48', ear:'round',  eye:'#33261c', nose:'#33261c', tail:true },
  { fur:'#7fc96a', ear:'frog',   eye:'#ffffff', wide:true },
  { fur:'#8a6b4f', ear:'spike',  eye:'#2f2a26', nose:'#2f2a26' },
  { fur:'#5aa9e6', ear:'none',   eye:'#ffffff', beak:true, small:true },
  { fur:'#b8bcc4', ear:'round',  eye:'#2f2a26', mask:true },
  { fur:'#f6f4ef', ear:'panda',  eye:'#2f2a26', panda:true },
  { fur:'#f4b8c4', ear:'pointy', eye:'#5a3a44', pig:true },
  { fur:'#a9713f', ear:'round',  eye:'#2f2a26', snout:true }
];
function drawAnimalFace(cx, cy, s, k){
  var a = ANIMALS[k % ANIMALS.length];
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  /* 耳朵 */
  ctx.fillStyle = a.fur;
  if(a.ear === 'pointy'){
    ctx.beginPath(); ctx.moveTo(-26, -18); ctx.lineTo(-30, -48); ctx.lineTo(-8, -30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(26, -18); ctx.lineTo(30, -48); ctx.lineTo(8, -30); ctx.closePath(); ctx.fill();
  }else if(a.ear === 'round'){
    ctx.beginPath(); ctx.ellipse(-25, -30, 12, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25, -30, 12, 12, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.ear === 'long'){
    ctx.beginPath(); ctx.ellipse(-15, -44, 8, 22, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(15, -44, 8, 22, -0.15, 0, Math.PI*2); ctx.fill();
  }else if(a.ear === 'spike'){
    for(var q = 0; q < 7; q++){
      var ang = Math.PI + q * (Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * 28, Math.sin(ang) * 28);
      ctx.lineTo(Math.cos(ang + 0.22) * 44, Math.sin(ang + 0.22) * 44);
      ctx.lineTo(Math.cos(ang + 0.44) * 28, Math.sin(ang + 0.44) * 28);
      ctx.closePath(); ctx.fill();
    }
  }else if(a.ear === 'frog'){
    ctx.beginPath(); ctx.ellipse(-20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.ear === 'panda'){
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.ellipse(-25, -30, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(25, -30, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = a.fur;
  }
  /* 脸 */
  ctx.fillStyle = a.fur;
  ctx.beginPath(); ctx.ellipse(0, 0, 32, 30, 0, 0, Math.PI*2); ctx.fill();
  if(a.white){
    ctx.fillStyle = '#fbf7f2';
    ctx.beginPath(); ctx.ellipse(0, 12, 18, 13, 0, 0, Math.PI*2); ctx.fill();
  }
  if(a.mask){
    ctx.fillStyle = '#3a3f47';
    ctx.fillRect(-30, -8, 60, 15);
  }
  if(a.panda){
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.ellipse(0, 0, 32, 30, 0, 0, Math.PI*2); ctx.fill();
  }
  /* 眼睛 */
  var ey = a.ear === 'frog' ? -22 : -4;
  if(a.ear === 'frog'){
    ctx.fillStyle = a.fur;
    ctx.beginPath(); ctx.ellipse(-20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -34, 13, 13, 0, 0, Math.PI*2); ctx.fill();
  }
  if(!a.panda){
    ctx.fillStyle = a.eye;
    ctx.beginPath(); ctx.ellipse(-12, ey, 8, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, ey, 8, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = a.ear === 'frog' ? '#2f2a26' : '#2f2a26';
    ctx.beginPath(); ctx.ellipse(-12, ey, 4, 4.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, ey, 4, 4.5, 0, 0, Math.PI*2); ctx.fill();
  }else{
    ctx.fillStyle = '#f6f4ef';
    ctx.beginPath(); ctx.ellipse(-12, -4, 9, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -4, 9, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.ellipse(-12, -4, 5, 5.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -4, 5, 5.5, 0, 0, Math.PI*2); ctx.fill();
  }
  /* 嘴 / 鼻 */
  if(a.beak){
    ctx.fillStyle = '#ff9a4d';
    ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(8, 8); ctx.lineTo(0, 20); ctx.closePath(); ctx.fill();
  }else if(a.wide){
    ctx.strokeStyle = '#3f7a34'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 8, 17, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }else if(a.pig){
    ctx.fillStyle = '#e88fa4';
    ctx.beginPath(); ctx.ellipse(0, 12, 12, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c96b82';
    ctx.beginPath(); ctx.ellipse(-4, 12, 2.4, 3.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, 12, 2.4, 3.4, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.snout){
    ctx.fillStyle = '#f0d9b8';
    ctx.beginPath(); ctx.ellipse(0, 12, 13, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3f2a';
    ctx.beginPath(); ctx.ellipse(0, 11, 4, 3.2, 0, 0, Math.PI*2); ctx.fill();
  }else if(a.nose){
    ctx.fillStyle = a.nose;
    ctx.beginPath(); ctx.moveTo(-5, 8); ctx.lineTo(5, 8); ctx.lineTo(0, 15); ctx.closePath(); ctx.fill();
  }else{
    ctx.strokeStyle = 'rgba(60,50,45,.6)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 12); ctx.quadraticCurveTo(0, 18, 8, 12); ctx.stroke();
  }
  if(a.tail){
    ctx.fillStyle = a.fur;
    ctx.beginPath(); ctx.ellipse(34, 18, 15, 20, 0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* 牌背图案。之前 12（或 24）张牌全画同一片叶子，一屏看过去是
   一片一模一样的绿，孩子只能靠位置记牌，画面也单调。
   改成 4 种森林图案轮着来 —— 图案只跟牌的下标走，不跟动物走，
   每局洗牌后位置照样随机，所以不会变成「看背面就知道是什么」的作弊提示。 */
function backPat(i){
  return (i + Math.floor(i / 4)) % 4;
}
function drawCardBack(pat, w, h){
  ctx.fillStyle = '#6fb85c';
  roundRect(-w/2, -h/2, w, h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  roundRect(-w/2, -h/2, w, h, 12); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.78)';
  if(pat === 1){
    /* 三颗浆果 */
    ctx.beginPath(); ctx.arc(-12, -5, 6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -5, 6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 10, 6, 0, 6.2832); ctx.fill();
  }else if(pat === 2){
    /* 小松树 */
    ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(14, 2); ctx.lineTo(-14, 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(18, 14); ctx.lineTo(-18, 14); ctx.closePath(); ctx.fill();
    ctx.fillRect(-3.5, 14, 7, 12);
  }else if(pat === 3){
    /* 橡果 */
    ctx.beginPath(); ctx.ellipse(0, 5, 10, 12, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    roundRect(-8, -11, 16, 7, 3); ctx.fill();
    ctx.fillRect(-1.5, -16, 3, 6);
  }else{
    /* 叶子（原来的图案，留作第一种） */
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.quadraticCurveTo(16, -4, 0, 16);
    ctx.quadraticCurveTo(-16, -4, 0, -14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(80,120,80,.6)';
    ctx.fillRect(-1.5, -14, 3, 26);
  }
}

var Mem = { cards:[], cols:4, rows:3, cw:0, ch:0, x0:0, y0:0, first:-1, flips:0, matched:0, lockT:0, el:0 };

function startMemory(){
  var c = gridCfg();
  Mem.cols = c.cols; Mem.rows = c.rows;
  var pairs = Math.floor(Mem.cols * Mem.rows / 2);
  var deck = [];
  for(var i = 0; i < pairs; i++){ deck.push(i); deck.push(i); }
  for(var s = deck.length - 1; s > 0; s--){
    var j = rndInt(0, s); var t = deck[s]; deck[s] = deck[j]; deck[j] = t;
  }
  Mem.cards = deck.map(function(k){ return { k:k, open:false, done:false, anim:0 }; });
  Mem.first = -1; Mem.flips = 0; Mem.matched = 0; Mem.lockT = 0; Mem.el = 0;
  var maxW = W - 120;
  /* 竖屏 H=960，纵向空间大，但 W=540 比横屏的 960 窄得多。Mem.cw 必须先按
     W 收紧（横屏是 110 上限；竖屏 4 列只 95，再 5 列就 75），Mem.ch 也按 H
     给的余量收紧。Mem.y0 在竖屏下推到 200，给顶栏（100px）+ 顶部副标（28px）
     留空，避免 4 行棋盘压到 140+4*ch+3*8。 */
  var maxH = VIEW.portrait ? (H - 380) : 300;
  Mem.cw = Math.min(110, Math.floor(maxW / Mem.cols) - 10);
  Mem.ch = Math.min(96, Math.floor(maxH / Mem.rows) - 8);
  Mem.x0 = (W - (Mem.cw + 10) * Mem.cols + 10) / 2;
  Mem.y0 = VIEW.portrait ? 200 : 150;
  Game.score = 0; Game.banner = 90;
}
function memRect(i){
  var r = Math.floor(i / Mem.cols), c = i % Mem.cols;
  return { x: Mem.x0 + c * (Mem.cw + 10), y: Mem.y0 + r * (Mem.ch + 8), w: Mem.cw, h: Mem.ch };
}
function updateMemory(dt){
  Mem.el += dt;
  if(Mem.lockT > 0){
    Mem.lockT -= dt;
    if(Mem.lockT <= 0){
      var a = Mem.cards[Mem.first], b = Mem.cards[Mem._second];
      if(a && b){
        if(a.k === b.k){ a.done = true; b.done = true; Mem.matched += 2; Audio2.match(); }
        else { a.open = false; b.open = false; }
      }
      Mem.first = -1; Mem._second = -1;
      if(Mem.matched >= Mem.cards.length){
        var base = gridCfg().base;
        /* Mem.el 累加的是帧数（dtF = dtSec * 60），不是秒。
           这里漏了 /60 就变成每秒扣 240 分，4 秒即跌到下限 50 —— 每局都是 50 分，
           saveBest 第一局之后再也触发不了「新纪录」。计分公式按秒写，就得按秒换算。 */
        var timePenalty = Math.floor(Mem.el / 60 * 4);
        var flipPenalty = Math.max(0, Mem.flips - Mem.cards.length) * 6;
        Game.score = Math.max(50, base - timePenalty - flipPenalty);
        endGame(Game.score, '用了 ' + Math.floor(Mem.el / 60) + ' 秒 · 翻了 ' + Mem.flips + ' 次');
      }
    }
  }
  for(var i = 0; i < Mem.cards.length; i++){
    var cd = Mem.cards[i];
    if(cd.open || cd.done){ if(cd.anim < 1) cd.anim = Math.min(1, cd.anim + dt * 0.18); }
    else { if(cd.anim > 0) cd.anim = Math.max(0, cd.anim - dt * 0.18); }
  }
}
function drawMemory(){
  drawBackdrop(Game.time * 60, 0);
  for(var i = 0; i < Mem.cards.length; i++){
    var cd = Mem.cards[i], r = memRect(i);
    if(cd.done){
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(76,175,109,.7)'; ctx.lineWidth = 2.5;
      roundRect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
      ctx.globalAlpha = 0.55;
      drawAnimalFace(r.x + r.w/2, r.y + r.h/2 + 2, Math.min(r.w, r.h) / 78, cd.k);
      ctx.globalAlpha = 1;
      continue;
    }
    var flip = cd.anim;
    ctx.save();
    ctx.translate(r.x + r.w/2, r.y + r.h/2);
    /* 翻牌动画：背面(flip=0)宽度1 → 中线(flip=0.5)宽度0 → 正面(flip=1)宽度1。
       之前用 cos(flip * π/2)，flip=1 时变成 0，卡片会压成一条细线，
       导致翻开后"看不到"。改用 cos(flip * π) 取绝对值即可。 */
    var sq = Math.abs(Math.cos(flip * Math.PI));
    ctx.scale(Math.max(0.06, sq), 1);
    if(flip < 0.5){
      drawCardBack(backPat(i), r.w, r.h);
    }else{
      ctx.fillStyle = '#fbf8ee';
      roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.fill();
      ctx.strokeStyle = 'rgba(120,140,120,.5)'; ctx.lineWidth = 2;
      roundRect(-r.w/2, -r.h/2, r.w, r.h, 12); ctx.stroke();
      drawAnimalFace(0, 2, Math.min(r.w, r.h) / 78, cd.k);
    }
    ctx.restore();
  }
  drawTopBar('记忆翻牌');
  ctx.fillStyle = 'rgba(31,77,46,.72)';
  ctx.font = '400 14px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('已配对 ' + (Mem.matched / 2) + ' / ' + (Mem.cards.length / 2) +
               '    翻牌 ' + Mem.flips + ' 次', W / 2, 66);
}

/* ============================================================
 * 11. 游戏注册表挂接
 * ------------------------------------------------------------
 * 把每个游戏的 start / update / draw / tap / banner 挂到 GAMES 上，
 * 主循环和输入都改成按 id 查表分发（见 p4）。以后新增小游戏只要在
 * GAMES 里 push 一条并挂上这几个字段，不用再动主循环的 if/else 链。
 * ========================================================== */
(function(){
  var impl = {
    acorn:  { start:startAcorn,   update:updateAcorn,   draw:drawAcorn,
              banner:'← → 或手指拖动，接橡果，躲开毛毛虫和毒蘑菇',
              tap:function(x, y){ Input.pointX = x; } },
    memory: { start:startMemory,  update:updateMemory,  draw:drawMemory,
              banner:'点开两张，一样的动物就配对成功',
              tap:function(x, y){
                if(Mem.lockT > 0) return;
                for(var c = 0; c < Mem.cards.length; c++){
                  var cd = Mem.cards[c];
                  if(cd.done || cd.open) continue;
                  if(hitRect(x, y, memRect(c))){
                    cd.open = true; Mem.flips++; Audio2.flip();
                    if(Mem.first < 0) Mem.first = c;
                    else { Mem._second = c; Mem.lockT = 34; }
                    return;
                  }
                }
              } }
  };
  for(var i = 0; i < GAMES.length; i++){
    var m = impl[GAMES[i].id];
    if(m){
      GAMES[i].start = m.start; GAMES[i].update = m.update; GAMES[i].draw = m.draw;
      GAMES[i].banner = m.banner; GAMES[i].tap = m.tap;
    }
  }
})();


/* ============================================================
 * 游戏三：找不同（观察力）
 * ------------------------------------------------------------
 * 与接橡果（反应）、记忆翻牌（记忆）错开，这个是纯观察力。
 *
 * 实现要点：
 * 1. 场景 = 一组程序化生成的 prop（树/灌木/蘑菇/花/石头/云/鸟/蝴蝶），
 *    左右两幅各画一次，右幅在副本上施加 N 种变换造出差异
 * 2. 差异记录成 hotspot，左右各一组坐标，点哪边都能命中
 * 3. 所有计时/位移一律乘 dt，否则 120Hz 屏上倒计时和动画会快一倍
 *
 * 加这个游戏只动了三处：p2 的 GAMES 加一条、本文件、merge.js 的 PARTS。
 * p3 / p4 一个字没改 —— 主循环、点击分发、开场横幅都是按 id 查表的。
 * ========================================================== */

/* 面板几何。横屏 960 宽里放两幅 444 的图，左右各留 24、中间隔 24；
   竖屏 540 宽纵向放两幅（左 + 12 边距），w=W-24=516，h=(H-184)/2≈388。
   都在 viewport 变更时按新 W/H 重算（不是常量），竖屏 W=540 时变成上下两幅。 */
var SPOT_W = 444, SPOT_H = 396, SPOT_TOP = 92;
function spotGeom(){
  if(VIEW.portrait){
    var w = W - 24, h = (H - 184) >> 1;  /* 上 92 + 间隔 0 + 下 92 = 184，剩余分两份 */
    return { w:w, h:h, top:92, gap:0, x:12, sideBySide:false };
  }
  return { w:444, h:396, top:92, gap:24, x:24, sideBySide:true };
}
function spotPanel(i){
  var g = spotGeom();
  if(g.sideBySide){
    return { x: g.x + i * (g.w + g.gap), y: g.top, w: g.w, h: g.h };
  }
  /* 竖屏：上 + 下 */
  return { x: g.x, y: g.top + i * (g.h + g.gap), w: g.w, h: g.h };
}

/* 难度：差异数 / 场景元素数 / 点错机会 / 限时（秒，0=不限）/ 计分基数 */
var SPOT_CFG = {
  /* easy 原本只有 color / size 两种，9 个景物里找 3 处，
     不是"变红了"就是"变小了"，玩两局就腻。加上 move 之后变化方式多一种，
     仍然是最好认的三种，没有 remove（凭空少一个对小朋友最不好找）。 */
  easy:   { diffs:3, props:9,  lives:5, time:0,  base:900,  kinds:['color','size','move'] },
  normal: { diffs:5, props:14, lives:4, time:0,  base:1300, kinds:['color','size','remove','move'] },
  hard:   { diffs:7, props:18, lives:3, time:75, base:1700, kinds:['color','size','remove','move','flip'] }
};
function spotCfg(){
  for(var i = 0; i < DIFFS.length; i++) if(DIFFS[i].id === Game.diff) return SPOT_CFG[Game.diff] || SPOT_CFG.easy;
  return SPOT_CFG.easy;
}

var Spot = {
  L:[], R:[], spots:[], found:0, misses:0,
  lives:0, maxLives:0, el:0, left:0, over:false,
  wrongT:0, wrongX:0, wrongY:0, timeLimit:0
};

/* ---------- 调色板 ----------
   同一类里的颜色必须肉眼能分辨，否则「换个颜色」这种差异等于没做。
   树的配色走「春夏 → 秋」：绿 / 深绿 / 黄绿 / 橙 / 赭，都是合理的树的颜色。 */
var SPOT_PAL = {
  tree:      ['#3f8f4f','#2f7a46','#7cc356','#e0a03c','#c96a3a'],
  bush:      ['#4c9c58','#357a45','#8ec96a','#d9a83c'],
  mushroom:  ['#e05a4a','#f0a03c','#d94f8c','#8e6bd0','#5ac0c9'],
  flower:    ['#f2b93c','#e8524f','#c86fd9','#4a90d9','#fbf7f2'],
  rock:      ['#8d9aa3','#6f7d87','#b0bac0'],
  bird:      ['#4a90d9','#e8524f','#f2b93c','#6fb85c'],
  cloud:     ['#ffffff','#eef4f7','#dfe9ef'],
  butterfly: ['#f2b93c','#e8524f','#9b6bd6','#4a90d9']
};
/* 每类能做哪些差异。
   cloud 不许 color —— 三个颜色都是近白，换了看不出来；
   rock 不许 color —— 灰色系差异太弱，只给大小/位移/消失；
   flip 只给有朝向的（鸟、蝴蝶），树和灌木画得太对称，翻了等于没翻。 */
var SPOT_KINDS = {
  tree:      ['color','size','move'],
  bush:      ['color','size','move'],
  mushroom:  ['color','size','move','remove'],
  flower:    ['color','size','move','remove'],
  rock:      ['size','move','remove'],
  bird:      ['color','move','remove','flip'],
  cloud:     ['size','move','remove'],
  butterfly: ['color','move','remove','flip']
};

function shuffleArr(a){
  for(var i = a.length - 1; i > 0; i--){
    var j = rndInt(0, i), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function cloneProp(p){ return { t:p.t, x:p.x, y:p.y, s:p.s, c:p.c, f:p.f, gone:false }; }

/* ---------- 元素绘制：全部以 (0,0) 为锚点 ----------
   地面元素（tree/bush/mushroom/flower/rock）锚点是底部中心，向上长；
   天空元素（cloud/bird/butterfly）锚点是几何中心。 */
var SPOT_DRAW = {
  tree: function(c){
    ctx.fillStyle = '#8a5a30';
    roundRect(-7, -46, 14, 46, 3); ctx.fill();
    ctx.fillStyle = SPOT_PAL.tree[c];
    ctx.beginPath(); ctx.arc(0, -64, 30, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(-23, -46, 22, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(23, -48, 24, 0, 6.2832); ctx.fill();
  },
  bush: function(c){
    ctx.fillStyle = SPOT_PAL.bush[c];
    ctx.beginPath(); ctx.arc(-18, -12, 18, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -21, 22, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(18, -12, 18, 0, 6.2832); ctx.fill();
  },
  mushroom: function(c){
    ctx.fillStyle = '#f2e6cf';
    roundRect(-6, -20, 12, 20, 4); ctx.fill();
    ctx.fillStyle = SPOT_PAL.mushroom[c];
    ctx.beginPath(); ctx.ellipse(0, -20, 22, 16, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-9, -26, 4.2, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -29, 3.2, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -23, 2.6, 0, 6.2832); ctx.fill();
  },
  flower: function(c){
    ctx.strokeStyle = '#4a8f52'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -26); ctx.stroke();
    ctx.fillStyle = '#5aa85f';
    ctx.beginPath(); ctx.ellipse(-9, -12, 8, 4, -0.5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = SPOT_PAL.flower[c];
    for(var i = 0; i < 6; i++){
      var a = i * Math.PI / 3;
      ctx.beginPath(); ctx.ellipse(Math.cos(a) * 9, -26 + Math.sin(a) * 9, 6.2, 6.2, 0, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = '#e8a72c';
    ctx.beginPath(); ctx.arc(0, -26, 5, 0, 6.2832); ctx.fill();
  },
  rock: function(c){
    ctx.fillStyle = SPOT_PAL.rock[c];
    ctx.beginPath(); ctx.ellipse(0, -12, 26, 14, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.ellipse(-8, -17, 11, 6, -0.3, 0, 6.2832); ctx.fill();
  },
  cloud: function(c){
    ctx.fillStyle = SPOT_PAL.cloud[c];
    ctx.beginPath(); ctx.arc(-24, 6, 15, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(-8, -6, 20, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -4, 18, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(26, 8, 13, 0, 6.2832); ctx.fill();
  },
  bird: function(c){
    ctx.fillStyle = SPOT_PAL.bird[c];
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 11, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -8, 8, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-13, -2); ctx.lineTo(-27, -9); ctx.lineTo(-25, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath(); ctx.ellipse(-2, -2, 12, 7, -0.4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e8a72c';
    ctx.beginPath(); ctx.moveTo(20, -8); ctx.lineTo(30, -5); ctx.lineTo(20, -1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2f2a26';
    ctx.beginPath(); ctx.arc(15, -10, 2, 0, 6.2832); ctx.fill();
  },
  butterfly: function(c){
    ctx.fillStyle = SPOT_PAL.butterfly[c];
    ctx.beginPath(); ctx.ellipse(-11, -7, 11, 9, -0.5, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11, -7, 11, 9, 0.5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(-9, -1, 7, 6, -0.5, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, -1, 7, 6, 0.5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#3a3f47';
    roundRect(-2.5, -10, 5, 20, 2.5); ctx.fill();
  }
};

function drawSpotProp(p, ox, oy){
  if(p.gone) return;
  ctx.save();
  ctx.translate(ox + p.x, oy + p.y);
  ctx.scale(p.s * p.f, p.s);
  SPOT_DRAW[p.t](p.c);
  ctx.restore();
}

/* ---------- 场景生成 ---------- */
/* 槽位网格：天空 2 行 × 6 列，地面 3 行 × 6 列，共 30 个。
   生成时随机取 N 个，天然避免元素叠在一起。
   槽位按当前 SPOT_W 自适应，竖屏下面板变宽时槽位也分散。 */
function spotSlots(){
  var s = [], cols = 6, c, r;
  var pg = spotGeom();
  var slotStepX = (pg.w - 74) / cols;
  var skyY = [44, 104], gndY = [Math.max(252, pg.h - 144), Math.max(312, pg.h - 84), Math.max(366, pg.h - 30)];
  for(r = 0; r < skyY.length; r++)
    for(c = 0; c < cols; c++)
      s.push({ x: 37 + c * slotStepX + rnd(-14, 14), y: skyY[r] + rnd(-9, 9), zone: 'sky' });
  for(r = 0; r < gndY.length; r++)
    for(c = 0; c < cols; c++)
      s.push({ x: 37 + c * slotStepX + rnd(-16, 16), y: gndY[r] + rnd(-10, 10), zone: 'gnd' });
  return s;
}

function spotGen(n){
  var slots = shuffleArr(spotSlots());
  var skyT = ['cloud', 'bird', 'butterfly'];
  var gndT = ['tree', 'bush', 'mushroom', 'flower', 'rock'];
  var out = [];
  for(var i = 0; i < n && i < slots.length; i++){
    var sl = slots[i];
    var types = (sl.zone === 'sky') ? skyT : gndT;
    var t = types[rndInt(0, types.length - 1)];
    out.push({ t:t, x:sl.x, y:sl.y, s:rnd(0.92, 1.08), c:rndInt(0, SPOT_PAL[t].length - 1), f:1, gone:false });
  }
  return out;
}

/* 取交集：这类元素能做的差异 ∩ 这个难度允许的差异 */
function spotKinds(type, allowed){
  var ks = SPOT_KINDS[type] || ['size'];
  var out = [];
  for(var i = 0; i < ks.length; i++) if(allowed.indexOf(ks[i]) >= 0) out.push(ks[i]);
  return out;
}

function startSpot(){
  var c = spotCfg();
  var L = spotGen(c.props);
  var R = [];
  for(var i = 0; i < L.length; i++) R.push(cloneProp(L[i]));

  var spots = [];
  var order = shuffleArr(L.map(function(_, i){ return i; }));
  for(var k = 0; k < order.length && spots.length < c.diffs; k++){
    var idx = order[k], p = L[idx], q = R[idx];
    var ks = spotKinds(p.t, c.kinds);
    if(!ks.length) continue;
    var kind = ks[rndInt(0, ks.length - 1)];

    var lx = p.x, ly = p.y, rx = q.x, ry = q.y;
    if(kind === 'color'){
      var pal = SPOT_PAL[p.t];
      if(pal.length < 2) continue;
      var nc = q.c;
      while(nc === q.c) nc = rndInt(0, pal.length - 1);
      q.c = nc;
    }else if(kind === 'size'){
      q.s = p.s * (Math.random() < 0.5 ? rnd(0.58, 0.70) : rnd(1.36, 1.55));
    }else if(kind === 'move'){
      var dx = (Math.random() < 0.5 ? -1 : 1) * rnd(30, 44);
      var dy = (Math.random() < 0.5 ? -1 : 1) * rnd(24, 36);
      var _pg = spotGeom();
      q.x = clamp(q.x + dx, 36, _pg.w - 36);
      q.y = clamp(q.y + dy, 30, _pg.h - 14);
      rx = q.x; ry = q.y;
    }else if(kind === 'flip'){
      q.f = -q.f;
    }else if(kind === 'remove'){
      q.gone = true;
    }
    /* 判定半径跟元素大小走，但有下限 —— 孩子手指戳不准，热区太小会一直点错 */
    spots.push({ lx:lx, ly:ly, rx:rx, ry:ry, r:Math.max(40, 30 * p.s), found:false, anim:0 });
  }

  Spot.L = L; Spot.R = R; Spot.spots = spots;
  Spot.found = 0; Spot.misses = 0;
  Spot.lives = c.lives; Spot.maxLives = c.lives;
  Spot.el = 0; Spot.left = c.time; Spot.timeLimit = c.time;
  Spot.over = false;
  Spot.wrongT = 0;
  Game.score = c.base;
  Game.banner = 90;
}

/* 实时分数：找齐了才给剩余机会奖励，没找齐不给 */
function spotScore(){
  var c = spotCfg();
  var timePen = Math.floor(Spot.el / 60 * 4);
  var missPen = Spot.misses * 60;
  var bonus = (Spot.spots.length && Spot.found >= Spot.spots.length) ? Spot.lives * 150 : 0;
  return Math.max(50, Math.floor(c.base + Spot.found * 120 + bonus - timePen - missPen));
}

function spotWin(){
  if(Spot.over) return;
  Spot.over = true;
  endGame(spotScore(), '用时 ' + Math.round(Spot.el / 60) + ' 秒 · 点错 ' + Spot.misses + ' 次');
}
function spotLose(why){
  if(Spot.over) return;
  Spot.over = true;
  endGame(spotScore(), why + ' · 找到 ' + Spot.found + ' / ' + Spot.spots.length);
}

function spotTap(x, y){
  if(Spot.over) return;
  var p0 = spotPanel(0), p1 = spotPanel(1);
  var isL = hitRect(x, y, p0), isR = hitRect(x, y, p1);
  if(!isL && !isR) return;

  var lx = x - p0.x, ly = y - p0.y;
  var rx = x - p1.x, ry = y - p1.y;
  for(var i = 0; i < Spot.spots.length; i++){
    var s = Spot.spots[i];
    if(s.found) continue;
    var d2, hit = false;
    if(isL){ d2 = (lx - s.lx) * (lx - s.lx) + (ly - s.ly) * (ly - s.ly); if(d2 <= s.r * s.r) hit = true; }
    if(!hit && isR){ d2 = (rx - s.rx) * (rx - s.rx) + (ry - s.ry) * (ry - s.ry); if(d2 <= s.r * s.r) hit = true; }
    if(hit){
      s.found = true; s.anim = 0.01;
      Spot.found++;
      Audio2.good(Spot.found);
      if(Spot.found >= Spot.spots.length) spotWin();
      return;
    }
  }
  Spot.misses++; Spot.lives--;
  Spot.wrongT = 42; Spot.wrongX = x; Spot.wrongY = y;
  Audio2.bad();
  if(Spot.lives <= 0) spotLose('机会用完');
}

function updateSpot(dt){
  if(Spot.over) return;
  Spot.el += dt;
  if(Spot.wrongT > 0) Spot.wrongT -= dt;
  for(var i = 0; i < Spot.spots.length; i++){
    var s = Spot.spots[i];
    if(s.found && s.anim < 1) s.anim = Math.min(1, s.anim + 0.085 * dt);
  }
  var c = spotCfg();
  if(c.time > 0){
    Spot.left = Math.max(0, Spot.left - dt / 60);
    if(Spot.left <= 0){ spotLose('时间到'); return; }
  }
  Game.score = spotScore();
}

/* ---------- 绘制 ---------- */
var SPOT_INSET = 3;
function drawSpotPanelBg(r){
  /* 先铺满整块：只画圆角矩形的话，四个角会露出底下 drawBackdrop 里飘动的云，
     两幅图的边缘一直在抖 —— 这类「比两幅图」的游戏里等于画面在动，没法比。
     铺满之后再把圆角画面画在里面，外圈就成了一道白色相框边。 */
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.fillRect(r.x, r.y, r.w, r.h);

  var i = SPOT_INSET;
  var g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  g.addColorStop(0, '#bfe3f5');
  g.addColorStop(0.55, '#dff0f8');
  g.addColorStop(0.56, '#a8d98a');
  g.addColorStop(1, '#7cc46a');
  ctx.fillStyle = g;
  roundRect(r.x + i, r.y + i, r.w - i * 2, r.h - i * 2, 12); ctx.fill();
  /* 太阳画在背景里（两幅图一样），云飘过去也好看 */
  ctx.fillStyle = 'rgba(255,226,120,.92)';
  ctx.beginPath(); ctx.arc(r.x + r.w - 58, r.y + 46, 21, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(90,120,100,.40)'; ctx.lineWidth = 2;
  roundRect(r.x + i, r.y + i, r.w - i * 2, r.h - i * 2, 12); ctx.stroke();
}

function drawSpotScene(list, panel){
  drawSpotPanelBg(panel);
  var i = SPOT_INSET;
  ctx.save();
  ctx.beginPath();
  roundRect(panel.x + i, panel.y + i, panel.w - i * 2, panel.h - i * 2, 12);
  ctx.clip();
  for(var k = 0; k < list.length; k++) drawSpotProp(list[k], panel.x, panel.y);
  ctx.restore();
}

function drawSpotMark(panel, hx, hy, r, anim){
  /* 弹一下再定住：0→1 用 easeOutBack，孩子能看清「找到了」在哪 */
  var t = anim;
  var sc = 1 + 2.2 * Math.pow(1 - t, 3) * Math.sin(t * 9);
  var a = clamp(t * 1.6, 0, 1);
  ctx.save();
  ctx.translate(panel.x + hx, panel.y + hy);
  ctx.scale(sc, sc);
  ctx.globalAlpha = a;
  ctx.strokeStyle = '#2f7a46'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = '#4caf6d'; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(-r * 0.34, 0); ctx.lineTo(-r * 0.06, r * 0.30); ctx.lineTo(r * 0.38, -r * 0.30);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawSpotWrong(){
  var a = clamp(Spot.wrongT / 42, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = '#e8524f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  var d = 15;
  ctx.beginPath();
  ctx.moveTo(Spot.wrongX - d, Spot.wrongY - d); ctx.lineTo(Spot.wrongX + d, Spot.wrongY + d);
  ctx.moveTo(Spot.wrongX + d, Spot.wrongY - d); ctx.lineTo(Spot.wrongX - d, Spot.wrongY + d);
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawSpot(){
  drawBackdrop(Game.time * 60, 0);
  var p0 = spotPanel(0), p1 = spotPanel(1);
  drawSpotScene(Spot.L, p0);
  drawSpotScene(Spot.R, p1);

  for(var i = 0; i < Spot.spots.length; i++){
    var s = Spot.spots[i];
    if(!s.found) continue;
    drawSpotMark(p0, s.lx, s.ly, s.r, s.anim);
    drawSpotMark(p1, s.rx, s.ry, s.r, s.anim);
  }
  if(Spot.wrongT > 0) drawSpotWrong();

  drawTopBar('找不同');
  drawHearts(Spot.lives, Spot.maxLives);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(31,77,46,.75)';
  ctx.font = '500 15px system-ui,sans-serif';
  ctx.fillText('找到 ' + Spot.found + ' / ' + Spot.spots.length, W / 2, 66);

  if(Spot.timeLimit > 0){
    var low = Spot.left <= 15;
    ctx.fillStyle = low ? '#d33' : 'rgba(31,77,46,.82)';
    ctx.font = '500 ' + (low ? 22 : 19) + 'px system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.ceil(Spot.left) + ' 秒', 24, 92);
  }
}

/* ---------- 注册到 GAMES ---------- */
(function(){
  for(var i = 0; i < GAMES.length; i++){
    if(GAMES[i].id !== 'spot') continue;
    GAMES[i].start  = startSpot;
    GAMES[i].update = updateSpot;
    GAMES[i].draw   = drawSpot;
    GAMES[i].tap    = spotTap;
    GAMES[i].banner = '找出两幅图不一样的地方，左右两边都能点';
  }
})();

/* 把内部对象暴露给测试脚本。p4 在启动时会把 __fsmExtras 并进 window.__fsm，
   所以加新游戏不用再去改 p4 的 __fsm 字面量。 */
window.__fsmExtras = {
  Spot:Spot, spotPanel:spotPanel, spotCfg:spotCfg, spotScore:spotScore
};


/* ============================================================
 * 11. 输入
 * ------------------------------------------------------------
 * 所有游戏相关的分支都走查表（curGame()），这里只管「输入 → 分发」。
 * 新增小游戏不用改本文件的任何 if/else。
 * ========================================================== */
/* mx / my 是鼠标在画布里的逻辑坐标，给 hoverRect() 做悬停反馈用。
   触屏不更新这两个值 —— 手指离屏后不该留下「鼠标还停在这儿」的假象。 */
var Input = { keys:{}, pointX:null, down:false, startY:0, touch:false, mx:null, my:null };

function toLogic(cx, cy){
  var r = canvas.getBoundingClientRect();
  return { x:(cx - r.left) / (r.width / W), y:(cy - r.top) / (r.height / H) };
}

window.addEventListener('keydown', function(e){
  Audio2.init(); Audio2.kick();
  var k = e.key.toLowerCase();
  if([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) >= 0) e.preventDefault();
  if(Input.keys[k]) return;
  Input.keys[k] = true;

  if(Game.state === 'menu'){
    /* 数字键选游戏：1~N，N 随 GAMES.length 自动变化，加游戏不用改这里 */
    var num = parseInt(k, 10);
    if(!isNaN(num) && num >= 1 && num <= GAMES.length){
      selectGame(GAMES[num - 1].id); Audio2.click();
    }else if(k === 'arrowleft' || k === 'a'){
      var list = optsList(curGame());
      var i = (optsIndex() + list.length - 1) % list.length;
      selectDiff(list[i].id); Audio2.click();
    }else if(k === 'arrowright' || k === 'd'){
      var list2 = optsList(curGame());
      var j = (optsIndex() + 1) % list2.length;
      selectDiff(list2[j].id); Audio2.click();
    }else if(k === ' ' || k === 'enter'){
      Audio2.click(); startCurrent();
    }
  }else if(Game.state === 'result'){
    if(k === ' ' || k === 'enter'){ Audio2.click(); startCurrent(); }
    else if(k === 'escape'){ Audio2.click(); Game.state = 'menu'; }
  }else{
    if(k === 'escape'){ Audio2.click(); Game.state = 'menu'; }
  }
});
window.addEventListener('keyup', function(e){ Input.keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', function(){ Input.keys = {}; Input.pointX = null; Input.down = false; });

canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  Audio2.init(); Audio2.kick();
  var p = toLogic(e.clientX, e.clientY);
  Input.down = true; Input.startY = p.y;
  if(e.pointerType && e.pointerType !== 'mouse') Input.touch = true;
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}

  /* 按钮命中一律走 padRect()：手机上把热区撑到 44 CSS 像素。
     卡片和牌本身已经够大，不扩 —— 扩了会让相邻热区重叠，点错牌。 */
  if(Game.state === 'menu'){
    if(hitRect(p.x, p.y, padRect(musicRect()))){ Audio2.toggleMusic(); return; }
    if(hitRect(p.x, p.y, padRect(linkRect()))){ Audio2.click(); openRunner(); return; }
    for(var i = 0; i < GAMES.length; i++){
      if(hitRect(p.x, p.y, cardRect(i))){
        selectGame(GAMES[i].id); Audio2.click();
        startCurrent(); return;
      }
    }
    var opts = optsList(curGame());
    for(var d = 0; d < opts.length; d++){
      if(hitRect(p.x, p.y, padRect(diffRect(d)))){
        selectDiff(opts[d].id); Audio2.click(); return;
      }
    }
  }else if(Game.state === 'result'){
    if(hitRect(p.x, p.y, padRect(musicRect()))){ Audio2.toggleMusic(); return; }
    if(hitRect(p.x, p.y, padRect(againRect()))){ Audio2.click(); startCurrent(); return; }
    if(hitRect(p.x, p.y, padRect(homeRect()))){ Audio2.click(); Game.state = 'menu'; return; }
  }else{
    if(hitRect(p.x, p.y, padRect(musicRect()))){ Audio2.toggleMusic(); return; }
    if(hitRect(p.x, p.y, padRect(backRect()))){ Audio2.click(); Game.state = 'menu'; return; }

    /* 游戏内点击：交给该游戏自己的 tap 处理（在 p3 的注册表里挂上） */
    var gt = curGame();
    if(gt.tap) gt.tap(p.x, p.y);
  }
});

canvas.addEventListener('pointermove', function(e){
  if(e.pointerType && e.pointerType !== 'mouse') Input.touch = true;
  else { var pm = toLogic(e.clientX, e.clientY); Input.mx = pm.x; Input.my = pm.y; }
  /* 只有需要拖动的游戏（接橡果）才跟手指，翻牌跟手会误翻 */
  if(Game.state !== 'play' || !curGame().drag) return;
  var p = toLogic(e.clientX, e.clientY);
  if(Input.down) Input.pointX = p.x;
});
canvas.addEventListener('pointerup', function(){
  Input.down = false;
  if(curGame().drag) Input.pointX = null;
});
canvas.addEventListener('pointercancel', function(){ Input.down = false; Input.pointX = null; });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

function startCurrent(){
  /* 按 id 查表分发：新增小游戏只要在 GAMES 上挂好 start，这里不用动 */
  var g = curGame();
  if(g.start) g.start();
  Game.state = 'play';
  Input.pointX = null;
}

/* ============================================================
 * 12. 开场提示横幅
 * ========================================================== */
function bannerText(){
  /* 查表：每个游戏在 GAMES 里自带 banner 文案，加游戏不用改这里 */
  var g = curGame();
  return g.banner || g.tip || '';
}
function drawBanner(){
  if(Game.banner <= 0) return;
  var a = clamp(Game.banner / 30, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(20,40,30,.72)';
  roundRect(W/2 - 300, 116, 600, 54, 26); ctx.fill();
  /* 15px 在手机上只剩 6px，等于没写。开口提示是告诉孩子怎么玩的，
     必须看得清，所以放大到 20px 并加粗。 */
  ctx.fillStyle = '#fff';
  ctx.font = '500 20px system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(bannerText(), W/2, 143);
  ctx.globalAlpha = 1;
}

/* ============================================================
 * 13. 主循环
 * ========================================================== */
var lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  var dtSec = Math.min(0.05, (ts - lastT) / 1000);
  lastT = ts;
  Game.time += dtSec;
  var dtF = dtSec * 60;

  if(Game.state === 'play'){
    if(Game.banner > 0) Game.banner = Math.max(0, Game.banner - dtF);
    var gu = curGame();
    if(gu.update) gu.update(dtF);
  }

  srTick();
  ctx.clearRect(0, 0, W, H);
  if(Game.state === 'menu') drawMenu();
  else if(Game.state === 'result') drawResult();
  else {
    var gd = curGame();
    if(gd.draw) gd.draw();
  }

  if(Game.state === 'play') drawBanner();
}

/* ============================================================
 * 14. 启动
 * ========================================================== */
/* 手动步进表：给诊断脚本脱离 rAF 快进用，直接从 GAMES 生成 */
var stepMap = {};
GAMES.forEach(function(g){ if(g.update) stepMap[g.id] = g.update; });

window.__fsm = {
  Game:Game, Audio2:Audio2, Input:Input,
  GAMES:GAMES, DIFFS:DIFFS, GRIDS:GRIDS,
  Acorn:Acorn, Mem:Mem,
  optsList:optsList, selectGame:selectGame, selectDiff:selectDiff, curGame:curGame,
  startCurrent:startCurrent, endGame:endGame, gridCfg:gridCfg,
  VIEW:VIEW, padRect:padRect, hoverRect:hoverRect,
  itemSize:itemSize, acornRamp:acornRamp, RAMP_STEPS:RAMP_STEPS,
  /* W/H 随窗口朝向变（横屏 960×540、竖屏 540×960），必须写成 getter：
     直接给值的话，转屏之后测试读到的还是启动那一次的老尺寸。 */
  get W(){ return W; },
  get H(){ return H; },
  diffName:diffName, optsIndex:optsIndex,
  cardRect:cardRect, diffRect:diffRect, musicRect:musicRect, linkRect:linkRect,
  againRect:againRect, homeRect:homeRect, memRect:memRect, backRect:backRect,
  openRunner:openRunner,
  _step:stepMap
};

/* 游戏片段（src/g-*.html）在主循环之前执行，没法直接往上面的 __fsm 字面量里加东西
   —— 那一刻它还不存在。所以它们把内部对象挂到 window.__fsmExtras，
   在这里统一并进来，供测试脚本访问。加新游戏不用再改上面那个字面量。 */
if(window.__fsmExtras){
  for(var xk in window.__fsmExtras) window.__fsm[xk] = window.__fsmExtras[xk];
}

resize();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
